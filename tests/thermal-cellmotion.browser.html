<!doctype html><meta charset="utf-8"><title>Thermal CellMotion verification</title><script src="../site/cellmotion-ai-manifest.js"></script><script src="../site/cellmotion-player.js"></script><style>body{font:14px system-ui;margin:20px}iframe{width:600px;height:500px;border:0}pre{white-space:pre-wrap}cellmotion-player{width:240px}button{padding:12px;margin:8px}</style><button id="verify">Verify live Manifest, player and origins</button><button id="exports">Generate PNG, GIF, MP4</button><pre id="report">Loading...</pre><cellmotion-player id="testPlayer"></cellmotion-player><iframe id="editor" src="../site/thermal-profile.html?preview=1"></iframe><script>
const report=document.querySelector('#report'),frame=document.querySelector('#editor'),player=document.querySelector('#testPlayer');let bridge,app,lastManifest;const wait=ms=>new Promise(r=>setTimeout(r,ms));async function until(f){for(let i=0;i<300;i++){if(f())return;await wait(50);}throw Error('Timed out');}const assert=(condition,name)=>{if(!condition)throw Error(name);report.textContent+='\nPASS '+name;};
frame.onload=async()=>{await until(()=>frame.contentWindow.CellMotionEffectBridge?.applyScheme);bridge=frame.contentWindow.CellMotionEffectBridge;app=frame.contentWindow.ThermalProfile;report.textContent='Ready';};
document.querySelector('#verify').onclick=async()=>{try{report.textContent='Running';const scheme=bridge.getScheme();scheme.canvas={width:320,height:400,fps:60};scheme.scene.text='热感 AI';scheme.scene.fontFamily='stg:noto-sc';scheme.scene.hot='#dd4fa3';scheme.scene.textColor='#f9f4de';scheme.scene.flip=true;scheme.motion.hold=3.6;const image=document.createElement('canvas');image.width=256;image.height=256;const ic=image.getContext('2d');ic.fillStyle='white';ic.fillRect(70,24,120,208);ic.clearRect(110,70,40,40);scheme.scene.media={source:'image',fileType:'image/png',imageName:'透明主体测试.png',originalDataUrl:image.toDataURL(),fit:'contain',mask:{mode:'alpha',protect:true,polygon:[],strokes:[{kind:'erase',radius:.02,points:[[.5,.5],[.5,.55]]}]}};await bridge.applyScheme(scheme);const definition=await (await fetch('../site/effects/thermal-profile.component.json')).json();lastManifest=CellMotionAI.createManifest({definition,scheme:bridge.getScheme(),baseUrl:new URL('../site/',document.baseURI).href});assert(CellMotionAI.validate(lastManifest).valid,'Manifest validation');assert(lastManifest.composition.scene.text==='热感 AI','Edited Chinese text retained');assert(lastManifest.composition.scene.media.originalDataUrl.startsWith('data:image/png'),'Embedded image retained');assert(lastManifest.composition.scene.media.mask.strokes.length===1,'Repair strokes retained');assert(lastManifest.assets.fonts.some(x=>x.id==='stg:noto-sc'),'Font asset indexed');assert(lastManifest.assets.embedded.some(x=>x.source==='composition.scene.media'),'Subject asset indexed');const ready=new Promise(resolve=>player.addEventListener('cellmotion-ready',resolve,{once:true}));player.manifest=lastManifest;await ready;const pc=()=>player.shadowRoot.querySelector('iframe').contentWindow;await until(()=>pc().ThermalProfile.state.text==='热感 AI');await until(()=>Math.abs(player.duration-app.duration)<.001);assert(Math.abs(player.duration-app.duration)<.001,'Player duration');player.pause();player.seek(2.7);await until(()=>Math.abs(pc().ThermalProfile.time-2.7)<.001);assert(!pc().ThermalProfile.playing,'Pause and seek');const a=document.createElement('canvas'),b=document.createElement('canvas');a.width=b.width=320;a.height=b.height=400;app.renderFrame(a.getContext('2d'),2.7,320,400);pc().ThermalProfile.renderFrame(b.getContext('2d'),2.7,320,400);const aa=a.getContext('2d').getImageData(0,0,320,400).data,bb=b.getContext('2d').getImageData(0,0,320,400).data;assert(aa.every((v,i)=>v===bb[i]),'Exact editor/player pixels');player.play();await until(()=>pc().ThermalProfile.playing);assert(pc().ThermalProfile.playing,'Play');player.restart();await wait(50);assert(pc().ThermalProfile.time<.5,'Restart');player.pause();const changed=JSON.parse(JSON.stringify(lastManifest.composition));changed.scene.text='LIVE UPDATE';player.update(changed);await until(()=>pc().ThermalProfile.state.text==='LIVE UPDATE');assert(pc().ThermalProfile.state.text==='LIVE UPDATE','Live composition update');const before=pc().ThermalProfile.state.text;pc().postMessage({type:'cellmotion:update',bridgeVersion:'9.0.0',composition:scheme},location.origin);await wait(80);assert(pc().ThermalProfile.state.text===before,'Reject unsupported bridge version');const rogue=document.createElement('iframe');rogue.src='about:blank';document.body.append(rogue);await wait(20);rogue.contentWindow.postMessage({type:'noop'},location.origin);pc().dispatchEvent(new MessageEvent('message',{data:{type:'cellmotion:update',bridgeVersion:'1.0.0',composition:scheme},source:rogue.contentWindow,origin:location.origin}));await wait(80);assert(pc().ThermalProfile.state.text===before,'Reject incorrect iframe source');rogue.remove();const response=await fetch('/__thermal-output?format=json',{method:'POST',body:JSON.stringify(lastManifest)});assert(response.ok,'Manifest saved to test server');report.textContent+='\nALL PASS';}catch(e){report.textContent+='\nFAIL '+e.stack;}};
document.querySelector('#exports').onclick=async()=>{try{const s=app.state;await app.apply({...s,width:320,height:400,export:{fps:15,duration:'3',seconds:3}});app.setTime(2.7);const win=frame.contentWindow,proto=win.HTMLAnchorElement.prototype,click=proto.click;let pending=[];proto.click=function(){const ext=this.download.split('.').pop();if(['png','gif','mp4'].includes(ext))pending.push(fetch(this.href).then(r=>r.blob()).then(blob=>fetch('/__thermal-output?format='+ext,{method:'POST',body:blob}).then(r=>{if(!r.ok)throw Error('Output save failed '+r.status);})));else click.call(this);};try{for(const format of ['png','gif','mp4']){await app.exportFile(format);await Promise.all(pending);report.textContent+='\nEXPORT '+format+' saved';}}finally{proto.click=click;}}catch(e){report.textContent+='\nFAIL '+e.stack;}};
</script>
