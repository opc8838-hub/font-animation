<!doctype html><meta charset="utf-8"><title>Thermal mask checks</title><pre id="results">Running</pre><script src="/media-layer.js"></script><script src="/thermal-mask.js"></script><script>
const log=[],assert=(v,m)=>{if(!v)throw Error(m)},at=(m,x,y)=>m.getContext('2d').getImageData(x,y,1,1).data[3],canvas=()=>Object.assign(document.createElement('canvas'),{width:200,height:200});
function test(name,fn){try{fn();log.push('PASS '+name)}catch(e){log.push('FAIL '+name+': '+e.message)}}
test('transparent input retains alpha including holes and semitransparent edges',()=>{const c=canvas(),x=c.getContext('2d');x.fillStyle='rgba(255,255,255,.5)';x.fillRect(50,50,100,100);x.clearRect(80,80,40,40);const r=ThermalMask.build(c,{});assert(r.method==='alpha','detect alpha');assert(at(r.mask,60,60)>=126&&at(r.mask,60,60)<=129,'alpha not squared');assert(at(r.mask,100,100)===0,'hole preserved')});
test('dark background with white object, automatic border sampling',()=>{const c=canvas(),x=c.getContext('2d');x.fillStyle='#172b49';x.fillRect(0,0,200,200);x.fillStyle='white';x.fillRect(60,30,80,140);const r=ThermalMask.build(c,{});assert(at(r.mask,0,0)===0,'background removed');assert(at(r.mask,100,100)===255,'white subject preserved');assert(Math.abs(r.bounds.w/.42-1)<.1,'bounds crop')});
test('interior background-color preservation is optional',()=>{const c=canvas(),x=c.getContext('2d');x.fillStyle='white';x.fillRect(0,0,200,200);x.fillStyle='black';x.fillRect(30,30,140,140);x.fillStyle='white';x.fillRect(70,70,60,60);assert(at(ThermalMask.build(c,{}).mask,100,100)===255,'preserve interior');assert(at(ThermalMask.build(c,{protect:false}).mask,100,100)===0,'remove interior')});
test('dark logo threshold retains negative space',()=>{const c=canvas(),x=c.getContext('2d');x.fillStyle='white';x.fillRect(0,0,200,200);x.fillStyle='black';x.fillRect(30,30,140,140);x.fillStyle='white';x.fillRect(70,70,60,60);const r=ThermalMask.build(c,{mode:'dark'});assert(at(r.mask,40,40)===255,'black kept');assert(at(r.mask,100,100)===0,'hole empty')});
test('polygon selection and erase / restore survive JSON roundtrip',()=>{const c=canvas(),x=c.getContext('2d');x.fillStyle='#888';x.fillRect(0,0,200,200);const cfg=ThermalMask.settings({mode:'manual',polygon:[[.2,.2],[.8,.2],[.8,.8],[.2,.8]],strokes:[{kind:'erase',radius:.08,points:[[.5,.5]]},{kind:'restore',radius:.03,points:[[.5,.5]]}]});const r=ThermalMask.build(c,JSON.parse(JSON.stringify(cfg)));assert(at(r.mask,10,10)===0,'outside polygon');assert(at(r.mask,60,60)===255,'inside polygon');assert(at(r.mask,112,100)===0,'eraser');assert(at(r.mask,100,100)===255,'restored center')});
test('landscape image keeps native resolution without exceeding cap',()=>{const c=Object.assign(canvas(),{width:3000,height:500}),r=ThermalMask.build(c,{});assert(r.width===3000&&r.height===500,'native landscape resolution')});
document.getElementById('results').textContent=log.join('\n');
</script>
