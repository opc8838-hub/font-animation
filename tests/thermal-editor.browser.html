<!doctype html><meta charset="utf-8"><title>Thermal editor interaction checks</title><style>body{font:14px system-ui}button{padding:12px}iframe{width:1280px;height:800px;border:0}pre{white-space:pre-wrap}</style><button id="audit">Audit editor and AI code</button><button id="mobile">Mobile 390px</button><pre id="report">Loading</pre><iframe id="editor" src="../site/thermal-profile.html"></iframe><script>
const f=document.querySelector('#editor'),report=document.querySelector('#report');let w,app,bridge;const wait=ms=>new Promise(r=>setTimeout(r,ms));const until=async fn=>{for(let i=0;i<300;i++){if(fn())return;await wait(40);}throw Error('Timed out');};const check=(ok,name)=>{if(!ok)throw Error(name);report.textContent+='\nPASS '+name;};f.onload=async()=>{w=f.contentWindow;await until(()=>w.CellMotionEffectBridge?.applyScheme);app=w.ThermalProfile;bridge=w.CellMotionEffectBridge;app.edit();report.textContent='Ready';};
document.querySelector('#audit').onclick=async()=>{try{report.textContent='Running';const doc=w.document,start=JSON.stringify(bridge.getScheme());doc.querySelector('#tcThemeToggle').click();doc.querySelector('#tcLanguageToggle').click();await wait(80);check(JSON.stringify(bridge.getScheme())===start,'Theme/language preserve composition');doc.querySelector('#thermalOpenLibrary').click();const sr=doc.querySelector('.gm-stage').getBoundingClientRect(),dr=doc.querySelector('#thermalAssetDrawer').getBoundingClientRect();check(sr.right<=dr.left+1,'Library leaves canvas visible');check(doc.querySelector('#selectedAsset').hidden,'Manager remains collapsed');doc.querySelector('.thermal-candidate').click();check(JSON.stringify(bridge.getScheme())===start,'Candidate click is selection only');doc.querySelector('.me-asset-commit').click();await until(()=>app.state.media?.libraryId==='flow-music');check(app.state.media.libraryId==='flow-music','Explicit shared asset insertion');check(doc.querySelector('#selectedAsset').hidden,'Insert does not expand manager');doc.querySelector('#thermalCloseDrawer').click();doc.querySelector('#layerToggle').click();doc.querySelector('.thermal-asset-actions button').click();check(!doc.querySelector('#thermalAssetEditor').hidden&&!app.playing,'Focused editing pauses readable frame');doc.dispatchEvent(new KeyboardEvent('keydown',{key:'Escape',bubbles:true}));check(!doc.querySelector('#thermalAssetBrowse').hidden,'Escape returns to library');doc.dispatchEvent(new KeyboardEvent('keydown',{key:'Escape',bubbles:true}));check(doc.querySelector('#thermalAssetDrawer').hidden,'Escape closes library');await app.apply({...app.defaultState,text:'COPY 热感',fontFamily:'stg:noto-sc',hot:'#dd4fa3'});app.edit();const captured=[];w.CellMotionAI.copyText=async value=>{captured.push(value);};doc.querySelector('[data-ai-action=code]').click();await until(()=>captured.length);const configuredCode=captured[0];check(configuredCode.includes('<cellmotion-player')&&configuredCode.includes('COPY 热感')&&configuredCode.includes('#dd4fa3'),'Real For AI action includes edited state');const r=await fetch('/__thermal-output?format=json',{method:'POST',body:JSON.stringify({configuredCode})});check(r.ok,'Configured code saved');const before=JSON.stringify(bridge.getScheme());doc.querySelector('[data-ai-action=prompt]').click();await until(()=>captured.length===2);check(captured[1].includes('runtime'),'Prompt includes Manifest');doc.querySelector('[data-ai-action=params]').click();await wait(20);check(doc.querySelector('.tc-ai-dialog').open,'Parameter guide opens');doc.querySelector('[data-ai-close]').click();check(JSON.stringify(bridge.getScheme())===before,'AI actions preserve composition');report.textContent+='\nALL PASS';}catch(e){report.textContent+='\nFAIL '+e.stack;}};
document.querySelector('#mobile').onclick=async()=>{f.style.width='390px';f.style.height='844px';await wait(150);const doc=w.document,r=doc.documentElement,stage=doc.querySelector('.gm-stage').getBoundingClientRect(),panel=doc.querySelector('.gm-inspector').getBoundingClientRect();report.textContent+='\n'+JSON.stringify({mobileWidth:r.clientWidth,scrollWidth:r.scrollWidth,stageAbovePanel:stage.bottom<=panel.top,aiVisible:doc.querySelector('.tc-ai-trigger').getBoundingClientRect().right<=390,exportVisible:doc.querySelector('.tc-export-shortcut').getBoundingClientRect().right<=390});};
</script>
