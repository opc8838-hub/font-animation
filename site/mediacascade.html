<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="镜头铺展：文字中插入媒体，横向复制成胶片条，再变成笔记本并放大至全屏。"><title>镜头铺展 Media Cascade | ME Motion Studio</title><link rel="icon" href="data:,"><link rel="stylesheet" href="continuation.css"><link rel="stylesheet" href="currentwall.css"><link rel="stylesheet" href="focuswheel.css"><link rel="stylesheet" href="me-motion-editor.css"><link rel="stylesheet" href="mediacascade.css?v=20260815-1"><link rel="stylesheet" href="stg-cn.css"></head><body class="me-motion-editor">
<main class="current-stage media-cascade-stage" aria-label="媒体镜头复制并展开至全屏画布"><canvas id="mediaCanvas"></canvas><div class="canvas-mark" aria-hidden="true"><span id="frameCounter">F 0000</span><span>30 FPS</span></div></main>
<details class="control-panel current-panel media-cascade-panel" open><summary><span><b>镜头铺展</b><small>MEDIA CASCADE / 42</small></span><i aria-hidden="true">参数</i></summary><div class="panel-scroll">
<section><div class="section-heading"><p class="section-label">文字与媒体</p><small class="section-note">前句 + 媒体插槽 + 后句</small></div><label class="stacked-control">前句<input id="prefixText" type="text" value="Edit a"></label><label class="stacked-control">后句<input id="suffixText" type="text" value="video."></label><label class="media-upload">上传图片 / GIF / 视频<input id="mediaUpload" type="file" accept="image/*,video/mp4,video/webm,video/quicktime"></label><div class="preset-actions"><button id="referencePreset" type="button">参考文案</button><button id="chinesePreset" type="button">中文示例</button><button id="restartTop" type="button">从头播放</button></div><p class="hint" id="mediaStatus">未上传时显示动态占位镜头；上传内容只在本地浏览器处理。</p></section>
<section class="font-picker"><div class="mc-font-grid"><label><span class="section-label">字体</span><select id="fontFamily"><option value="inter" selected>Inter</option><option value="space">Space Grotesk</option><option value="manrope">Manrope</option><option value="poppins">Poppins</option><option value="noto">Noto Sans SC · 中文</option></select></label><label><span class="section-label">字重</span><select id="fontWeight"><option value="400">Regular · 400</option><option value="500" selected>Medium · 500</option><option value="600">Semibold · 600</option><option value="700">Bold · 700</option></select></label></div></section>
<section><div class="section-heading"><p class="section-label">镜头时间线</p><small class="section-note">从插槽到全屏的每一段都可控</small></div><div class="motion-map mc-motion-map"><span>文字聚合</span><i>→</i><span>镜头复制</span><i>→</i><span>笔记本</span><i>→</i><span>全屏</span></div><div class="controls-grid quick-grid"><label>整体速度 <output id="speedOut">1.00×</output><input id="speed" type="range" min="0.25" max="4" step="0.05" value="1"></label><label>文字聚合 <output id="titleInOut">0.90秒</output><input id="titleIn" type="range" min="100" max="5000" step="10" value="900"></label><label>窄镜头出现 <output id="seedInOut">0.38秒</output><input id="seedIn" type="range" min="80" max="3000" step="10" value="380"></label><label>横向复制 <output id="duplicateOut">0.80秒</output><input id="duplicate" type="range" min="100" max="5000" step="10" value="800"></label><label>胶片停留 <output id="stripHoldOut">0.45秒</output><input id="stripHold" type="range" min="0" max="5000" step="10" value="450"></label><label>文字退场 <output id="textExitOut">0.42秒</output><input id="textExit" type="range" min="80" max="3000" step="10" value="420"></label><label>变成笔记本 <output id="laptopInOut">0.62秒</output><input id="laptopIn" type="range" min="100" max="5000" step="10" value="620"></label><label>放大到全屏 <output id="fullscreenInOut">0.72秒</output><input id="fullscreenIn" type="range" min="100" max="5000" step="10" value="720"></label><label>全屏停留 <output id="fullscreenHoldOut">1.40秒</output><input id="fullscreenHold" type="range" min="0" max="10000" step="10" value="1400"></label><label>展开节奏 <select id="rhythm"><option value="cinematic" selected>电影式加速</option><option value="smooth">柔和匀速</option><option value="snap">快速弹开</option><option value="elastic">弹性铺展</option></select></label></div></section>
<section><div class="section-heading"><p class="section-label">胶片与笔记本</p><small class="section-note">镜头数量、间距和外观都能编辑</small></div><div class="controls-grid"><label>复制镜头数量 <output id="copyCountOut">5</output><input id="copyCount" type="range" min="2" max="12" value="5"></label><label>胶片总宽 <output id="stripWidthOut">62%</output><input id="stripWidth" type="range" min="20" max="140" value="62"></label><label>胶片高度 <output id="stripHeightOut">17%</output><input id="stripHeight" type="range" min="5" max="55" value="17"></label><label>镜头间距 <output id="shotGapOut">5px</output><input id="shotGap" type="range" min="0" max="50" value="5"></label><label>复制方向 <select id="direction"><option value="both" selected>中心向两侧</option><option value="left">向左复制</option><option value="right">向右复制</option></select></label><label>媒体裁切 <select id="mediaFit"><option value="cover" selected>铺满裁切</option><option value="contain">完整显示</option></select></label><label>笔记本大小 <output id="laptopSizeOut">52%</output><input id="laptopSize" type="range" min="20" max="100" value="52"></label><label>边框粗细 <output id="bezelOut">12px</output><input id="bezel" type="range" min="0" max="60" value="12"></label><label>全屏边距 <output id="fullscreenMarginOut">0%</output><input id="fullscreenMargin" type="range" min="0" max="30" value="0"></label><label>镜头播放速度 <output id="mediaSpeedOut">1.00×</output><input id="mediaSpeed" type="range" min="0.1" max="4" step="0.05" value="1"></label></div></section>
<section><div class="section-heading"><p class="section-label">文字与画面</p><small class="section-note">开头文字保持整体居中</small></div><div class="controls-grid"><label>字号 <output id="fontSizeOut">112px</output><input id="fontSize" type="range" min="24" max="280" value="112"></label><label>字距 <output id="trackingOut">-4px</output><input id="tracking" type="range" min="-18" max="46" value="-4"></label><label>媒体插槽宽 <output id="slotWidthOut">26%</output><input id="slotWidth" type="range" min="5" max="80" value="26"></label><label>水平位置 <output id="textXOut">50%</output><input id="textX" type="range" min="5" max="95" value="50"></label><label>垂直位置 <output id="textYOut">50%</output><input id="textY" type="range" min="5" max="95" value="50"></label><label>紫色光晕 <output id="glowOut">70%</output><input id="glow" type="range" min="0" max="150" value="70"></label><label>文字退场距离 <output id="exitDistanceOut">38%</output><input id="exitDistance" type="range" min="0" max="100" value="38"></label><label>文字错位幅度 <output id="titleOffsetOut">48px</output><input id="titleOffset" type="range" min="0" max="200" value="48"></label></div></section>
<section class="color-row mc-colors"><label>背景<input id="backgroundColor" type="color" value="#000000"></label><label>文字<input id="textColor" type="color" value="#ffffff"></label><label>光晕<input id="glowColor" type="color" value="#8b35ff"></label><label>笔记本<input id="laptopColor" type="color" value="#15151a"></label></section>
<section class="transport"><button id="restartButton" type="button">重播</button><button id="pauseButton" type="button">暂停</button><button id="backButton" type="button">−1 帧</button><button id="forwardButton" type="button">+1 帧</button></section>
<section class="export-panel"><label class="section-label" for="exportPreset">导出尺寸</label><select id="exportPreset"><option value="current">当前画板</option><option value="1080x1080">1:1 · 1080 × 1080</option><option value="1080x1350">4:5 · 1080 × 1350</option><option value="1080x1920">9:16 · 1080 × 1920</option><option value="1920x1080">16:9 · 1920 × 1080</option><option value="custom">自定义尺寸</option></select><div class="custom-size" id="customSize" hidden><label>宽<input id="exportWidth" type="number" min="240" max="3840" value="1080"></label><span>×</span><label>高<input id="exportHeight" type="number" min="240" max="3840" value="1920"></label></div><div class="export-timing-grid"><label>导出时长<select id="exportDuration"><option value="cycle" selected>完整一轮</option><option value="3">3 秒</option><option value="5">5 秒</option><option value="10">10 秒</option><option value="custom">自定义</option></select></label><label>导出帧率<select id="exportFps"><option value="15">15 FPS</option><option value="24">24 FPS</option><option value="30" selected>30 FPS</option><option value="60">60 FPS</option></select></label></div><label class="custom-duration" id="customDurationWrap" hidden>自定义秒数<input id="customDuration" type="number" min="0.5" max="30" step="0.1" value="6"></label><div class="export-actions"><button id="exportPng" type="button">PNG 图片</button><button id="exportGif" type="button">GIF 动图</button><button id="exportVideo" type="button">视频</button><button class="export-hd-video" id="exportVerticalVideo" type="button">导出 9:16 高清视频 · 1080 × 1920</button></div><p class="export-status" id="exportStatus" aria-live="polite">上传视频时，GIF/视频导出会逐帧读取对应素材时间。</p></section><p class="formula">文字插槽 × 横向镜头复制 × 笔记本合拢 × 全屏放大<br>图片、GIF 和视频共用同一套媒体裁切与时间线</p>
</div></details><script src="js/continuation-gif.js"></script><script src="CCapture.all.min.js"></script><script src="mediacascade.js?v=20260815-1"></script><script src="me-motion-editor.js"></script><script src="stg-cn.js?v=20260815-mediacascade"></script></body></html>
