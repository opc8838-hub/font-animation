<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="降临：主体落下，灯光像苹果发布会那样从四周收拢、越来越快地一下关掉，主体只剩轮廓光，品牌标题随后弹出。">
  <link rel="icon" href="favicon.svg">
  <title>降临 Switch Drop | CellMotion</title>
  <link rel="stylesheet" href="workspace-editor.css?v=20260901-1">
  <link rel="stylesheet" href="me-motion-editor.css?v=20260909-timeline-color">
  <link rel="stylesheet" href="shared-fonts.css?v=20261006-garden1">
  <link rel="stylesheet" href="stg-cn.css?v=20260824-1">
  <link rel="stylesheet" href="glyphmorph-reviewed.css?v=20260909-media-crop">
  <link rel="stylesheet" href="typecascade-workspace.css?v=20260909-coloriso">
  <link rel="stylesheet" href="typecascade-polish.css?v=20261006-garden1">
  <link rel="stylesheet" href="switchdrop-editor.css?v=20261010-1">
<link rel="stylesheet" href="site-preferences.css?v=20260926-18">
</head>
<body class="glyphmorph-editor" data-switchdrop="true" data-editor-capabilities="text-only">
  <aside id="glyphMorphInspector" class="gm-inspector" aria-label="降临编辑器">
    <header class="gm-header">
      <a class="tc-brand" href="cellmotion.html" aria-label="CellMotion 首页"><img src="assets/cellmotion/logo-original-transparent.png?v=20260926-1" alt="CellMotion"></a>
      <div><small>让创意，自由生长</small><h1>降临 <span data-no-translate>Switch Drop</span></h1></div>
    </header>

    <section class="gm-card gm-canvas-card">
      <div class="gm-card-title"><span>01</span><h2>画布尺寸</h2></div>
      <label class="gm-field gm-field-wide">预设
        <select id="canvasPreset">
          <option value="1920x1080">16:9 横版 · 1920 × 1080</option>
          <option value="1440x1080">4:3 横版 · 1440 × 1080</option>
          <option value="1620x1080">3:2 横版 · 1620 × 1080</option>
          <option value="1200x628">横幅 · 1200 × 628</option>
          <option value="1080x1080">1:1 方形 · 1080 × 1080</option>
          <option value="1080x1350">4:5 竖版 · 1080 × 1350</option>
          <option value="1080x1920">9:16 全屏 · 1080 × 1920</option>
          <option value="custom">自定义</option>
        </select>
      </label>
      <div class="gm-grid-2 gm-custom-size" hidden>
        <label class="gm-field">宽度 <input id="canvasWidth" type="number" min="320" max="3840" step="1" value="1920"></label>
        <label class="gm-field">高度 <input id="canvasHeight" type="number" min="320" max="3840" step="1" value="1080"></label>
      </div>
    </section>

    <section class="gm-card">
      <div class="gm-card-title"><span>02</span><h2>画面内容</h2><button id="addRow" class="gm-text-button" type="button">标题</button></div>
      <p class="gm-help">两行内容：主体（图标、图片或文字）和右侧标题。</p>
      <div id="sequenceRows" class="gm-sequence"></div>
    </section>

    <section class="gm-card" data-sd-global-card>
      <div class="gm-card-title"><span>03</span><h2>灯光开关</h2></div>
      <div class="gm-grid-2">
        <label class="gm-field">方向
          <select id="switchMode"><option value="off">关灯 · 亮 → 黑</option><option value="on">开灯 · 黑 → 亮</option></select>
        </label>
        <label class="gm-field">开关曲线
          <select id="switchEase"><option value="apple">苹果关灯 · 慢入快出（原片）</option><option value="balanced">平衡丝滑</option><option value="snappy">快速开关</option></select>
        </label>
        <label class="gm-field">光的形态
          <select id="switchShape"><option value="spot">聚光收拢 · 四周先暗（原片）</option><option value="uniform">整屏均匀变暗</option></select>
        </label>
        <label class="gm-field">开关时长 <input id="switchDuration" type="range" min="80" max="3000" step="10"><output for="switchDuration"></output></label>
        <label class="gm-field">相对左移延后 <input id="switchDelay" type="range" min="0" max="1500" step="10"><output for="switchDelay"></output></label>
        <label class="gm-field">亮灯时四周暗角 <input id="vignette" type="range" min="0" max="200" step="1"><output for="vignette"></output></label>
        <label class="gm-field">亮灯背景 <input id="backgroundColor" type="color"></label>
        <label class="gm-field">关灯后颜色 <input id="darkColor" type="color"></label>
      </div>
      <p class="gm-help">原片逐帧测得：关灯约 0.24 秒，四周比中心先暗，越暗越快，最后一下直接黑掉。</p>
    </section>

    <section class="gm-card" data-sd-global-card>
      <div class="gm-card-title"><span>04</span><h2>速度与节奏</h2></div>
      <div class="gm-grid-2">
        <label class="gm-field">整体速度 <input id="speed" type="range" min="0.25" max="3" step="0.05"><output for="speed"></output></label>
        <label class="gm-field">下降时长 <input id="dropDuration" type="range" min="250" max="3200" step="10"><output for="dropDuration"></output></label>
        <label class="gm-field">开始高度 <input id="startY" type="range" min="-70" max="0" step="1"><output for="startY"></output></label>
        <label class="gm-field">落点高度 <input id="endY" type="range" min="25" max="75" step="1"><output for="endY"></output></label>
        <label class="gm-field">下降惯性 <input id="dropOvershoot" type="range" min="0" max="22" step="1"><output for="dropOvershoot"></output></label>
        <label class="gm-field">到底停顿 <input id="settleDuration" type="range" min="0" max="5000" step="10"><output for="settleDuration"></output></label>
        <label class="gm-field">左移时长 <input id="shiftDuration" type="range" min="100" max="1800" step="10"><output for="shiftDuration"></output></label>
        <label class="gm-field">标题延后 <input id="titleDelay" type="range" min="0" max="1500" step="10"><output for="titleDelay"></output></label>
        <label class="gm-field">标题弹出 <input id="titleDuration" type="range" min="80" max="1800" step="10"><output for="titleDuration"></output></label>
        <label class="gm-field">标题弹性 <input id="titleSpring" type="range" min="0" max="55" step="1"><output for="titleSpring"></output></label>
        <label class="gm-field">结束定格 <input id="holdDuration" type="range" min="0" max="12000" step="50"><output for="holdDuration"></output></label>
      </div>
      <label class="gm-check"><input id="loop" type="checkbox"><span>循环播放</span></label>
    </section>

    <section class="gm-card" data-sd-global-card>
      <div class="gm-card-title"><span>05</span><h2>标题字体</h2></div>
      <div class="gm-grid-2">
        <label class="gm-field">字体
          <select id="fontFamily"><option value="stg:manrope">Manrope</option></select>
        </label>
        <label class="gm-field">标题颜色 <input id="textColor" type="color"></label>
      </div>
    </section>

    <section class="gm-card" data-sd-global-card>
      <div class="gm-card-title"><span>06</span><h2>画面背景</h2></div>
      <div class="sd-background">
        <div class="gm-row-background-grid">
          <label class="gm-background-upload">上传 / 更换背景<input id="backgroundFile" type="file" accept="image/png,image/jpeg,image/webp,image/gif,video/mp4,video/webm,video/quicktime"></label>
          <label>素材不透明度<input id="backgroundOpacity" type="number" min="0" max="100" step="1"><small>%</small></label>
          <p class="gm-help sd-wide">背景图片或视频处在灯光下，关灯时会和主体一起暗下去。</p>
          <div class="gm-background-video" id="backgroundMediaInfo" hidden>
            <div class="gm-background-video-head"><strong id="backgroundMediaName"></strong><span id="backgroundMediaType"></span><button id="backgroundRemove" type="button">移除素材</button></div>
            <div class="gm-background-crop">
              <div class="gm-background-crop-head"><strong>画面裁剪</strong><span>在画面中拖动选择保留区域</span></div>
              <canvas id="backgroundCropPreview" width="720" height="405" aria-label="背景画面裁剪预览"></canvas>
              <label class="gm-background-crop-zoom">画面缩放
                <input id="backgroundCropZoom" type="range" min="1" max="4" step="0.01" value="1">
                <output id="backgroundCropOutput">1.00×</output>
              </label>
              <button id="backgroundCropReset" type="button">居中并恢复原始缩放</button>
            </div>
            <div class="gm-background-video-trim" id="backgroundVideoTrim" hidden>
              <div class="gm-video-timeline" id="backgroundVideoTimeline" aria-label="拖动两侧把手裁剪视频片段">
                <canvas id="backgroundFilmstrip" width="720" height="96"></canvas>
                <div class="gm-video-selection" id="backgroundVideoSelection"><span class="gm-video-handle is-start" data-video-edge="start" role="slider" tabindex="0"></span><span class="gm-video-handle is-end" data-video-edge="end" role="slider" tabindex="0"></span></div>
              </div>
              <div class="gm-video-scale"><span>0.0 秒</span><span id="backgroundVideoDuration">读取中…</span></div>
              <div class="gm-video-time-fields">
                <label>开始秒数<input id="backgroundVideoStart" type="number" min="0" step="0.1" value="0"></label>
                <label>结束秒数<input id="backgroundVideoEnd" type="number" min="0.1" step="0.1" value=""></label>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <section class="gm-card">
      <div class="gm-card-title"><span>07</span><h2>时间轴</h2></div>
      <div class="me-choreo-scroll"><div id="timeline" class="gm-timeline me-choreo-track me-choreo-bar" role="list" aria-label="降临动效时间轴"></div></div>
      <input id="scrubber" class="gm-scrubber me-choreo-playhead" type="range" min="0" max="1" step="0.001" value="0" aria-label="时间轴播放头">
      <div class="gm-time-readout"><span id="timeNow">0.00s</span><span id="timeTotal">0.00s</span></div>
    </section>

    <section class="gm-card">
      <div class="gm-card-title"><span>08</span><h2>方案</h2></div>
      <div class="gm-actions gm-actions-4">
        <button id="saveScheme" type="button">保存方案</button>
        <button id="importScheme" type="button">导入方案</button>
        <button id="restoreScheme" type="button">恢复默认</button>
        <button id="clearScheme" type="button" aria-label="灯光与节奏恢复原片">清理重做</button>
      </div>
      <input id="schemeFile" type="file" accept="application/json,.json" hidden>
    </section>

    <section class="gm-card">
      <div class="gm-card-title"><span>09</span><h2>真实导出</h2></div>
      <div class="gm-grid-2">
        <label class="gm-field">时长
          <select id="exportDuration"><option value="cycle">完整循环</option><option value="3">3 秒</option><option value="5">5 秒</option><option value="10">10 秒</option></select>
        </label>
        <label class="gm-field">帧率
          <select id="exportFps"><option value="24">24 fps</option><option value="30" selected>30 fps</option><option value="60">60 fps</option></select>
        </label>
      </div>
      <div class="gm-actions gm-actions-3">
        <button id="exportPng" type="button">PNG</button>
        <button id="exportGif" type="button">GIF</button>
        <button id="exportMp4" type="button">MP4</button>
      </div>
      <p id="exportStatus" class="gm-status" aria-live="polite">输出将严格使用当前画布尺寸。</p>
    </section>
  </aside>

  <main id="glyphMorphStage" class="gm-stage">
    <div id="compositionFrame" class="gm-composition-frame">
      <canvas id="glyphMorphCanvas" width="1920" height="1080" aria-label="降临效果预览"></canvas>
    </div>
    <div class="gm-stage-controls me-stage-controls" aria-label="预览控制">
      <button id="toggleInspector" type="button" aria-pressed="false">▤ <span>编辑器</span></button>
      <i aria-hidden="true"></i>
      <button id="restartPreview" type="button">↺ <span>重播</span></button>
      <button id="togglePlayback" type="button" aria-pressed="false">Ⅱ <span>暂停</span></button>
    </div>
  </main>

  <script src="js/continuation-gif.js?v=20260824-1"></script>
  <script src="shared-font-library.js?v=20261006-garden1"></script>
  <script src="cellmotion-animated-image.js?v=20260909-1"></script>
  <script src="token-asset-tools.js"></script>
  <script src="switchdrop-editor.js?v=20261010-1"></script>
  <script src="stg-cn.js?v=20261010-spot1"></script>
  <script src="typecascade-workspace.js?v=20261006-notr1"></script>
  <script src="typecascade-polish.js?v=20260909-coloriso"></script>
  <script src="typecascade-selects.js?v=20260909-1"></script>
  <script src="typecascade-locale.js?v=20261010-sd1"></script>
  <script src="cellmotion-ai-manifest.js?v=20260909-ai-manifest"></script>
  <script src="cellmotion-ai-menu.js?v=20260909-standard"></script>
<script defer src="site-preferences.js?v=20261006-spot"></script>
</body>
</html>
