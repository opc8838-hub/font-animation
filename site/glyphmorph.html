<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1 1'></svg>">
  <title>字融 Glyph Morph | ME Motion Studio</title>
  <link rel="stylesheet" href="workspace-editor.css?v=20260901-1">
  <link rel="stylesheet" href="me-motion-editor.css?v=20260901-1">
  <link rel="stylesheet" href="shared-fonts.css?v=20260824-2">
  <link rel="stylesheet" href="stg-cn.css?v=20260824-1">
  <link rel="stylesheet" href="glyphmorph.css?v=20260901-2">
</head>
<body class="glyphmorph-editor">
  <aside id="glyphMorphInspector" class="gm-inspector" aria-label="字融编辑器">
    <header class="gm-header">
      <a href="gallery.html" aria-label="返回效果库">ME</a>
      <div><small>ME MOTION STUDIO</small><h1>字融 <span>Glyph Morph</span></h1></div>
    </header>

    <section class="gm-card gm-canvas-card">
      <div class="gm-card-title"><span>01</span><h2>画布尺寸</h2></div>
      <label class="gm-field gm-field-wide">预设
        <select id="canvasPreset">
          <option value="1080x1080">1:1 方形 · 1080 × 1080</option>
          <option value="1080x1350">4:5 竖版 · 1080 × 1350</option>
          <option value="1080x1440">3:4 竖版 · 1080 × 1440</option>
          <option value="1080x1620">2:3 竖版 · 1080 × 1620</option>
          <option value="1080x1920">9:16 全屏 · 1080 × 1920</option>
          <option value="1920x1080">16:9 横版 · 1920 × 1080</option>
          <option value="1440x1080">4:3 横版 · 1440 × 1080</option>
          <option value="1620x1080">3:2 横版 · 1620 × 1080</option>
          <option value="custom">自定义</option>
        </select>
      </label>
      <div class="gm-grid-2 gm-custom-size" hidden>
        <label class="gm-field">宽度 <input id="canvasWidth" type="number" min="320" max="3840" step="1" value="1080"></label>
        <label class="gm-field">高度 <input id="canvasHeight" type="number" min="320" max="3840" step="1" value="1080"></label>
      </div>
    </section>

    <section class="gm-card">
      <div class="gm-card-title"><span>02</span><h2>文字序列</h2><button id="addRow" class="gm-text-button" type="button">＋ 添加</button></div>
      <p class="gm-help">每一行是一个画面。重复字形会沿基线移位，其余字形原位缩放。</p>
      <div id="sequenceRows" class="gm-sequence"></div>
    </section>

    <section class="gm-card">
      <div class="gm-card-title"><span>03</span><h2>字体与构图</h2></div>
      <label class="gm-field gm-field-wide">字体
        <select id="fontFamily"><option value="stg:inter">Inter</option></select>
      </label>
      <div class="gm-grid-2">
        <label class="gm-field">字号 <input id="fontSize" type="range" min="42" max="260" step="1"><output for="fontSize"></output></label>
        <label class="gm-field">字距 <input id="tracking" type="range" min="-12" max="60" step="1"><output for="tracking"></output></label>
        <label class="gm-field">水平 <input id="positionX" type="range" min="-40" max="40" step="1"><output for="positionX"></output></label>
        <label class="gm-field">垂直 <input id="positionY" type="range" min="-40" max="40" step="1"><output for="positionY"></output></label>
      </div>
      <div class="gm-grid-2">
        <label class="gm-field">文字色 <input id="textColor" type="color"></label>
        <label class="gm-field">背景色 <input id="backgroundColor" type="color"></label>
      </div>
      <fieldset class="gm-segmented"><legend>对齐</legend>
        <label><input type="radio" name="alignment" value="left"><span>左</span></label>
        <label><input type="radio" name="alignment" value="center"><span>中</span></label>
        <label><input type="radio" name="alignment" value="right"><span>右</span></label>
      </fieldset>
    </section>

    <section class="gm-card">
      <div class="gm-card-title"><span>04</span><h2>动效节奏</h2></div>
      <div class="gm-grid-2">
        <label class="gm-field">变形 <input id="morphDuration" type="range" min="180" max="1400" step="10"><output for="morphDuration"></output></label>
        <label class="gm-field">错峰 <input id="characterDelay" type="range" min="0" max="100" step="1"><output for="characterDelay"></output></label>
        <label class="gm-field">缩放底值 <input id="scaleFloor" type="range" min="0" max="0.35" step="0.01"><output for="scaleFloor"></output></label>
        <label class="gm-field">总速度 <input id="speed" type="range" min="0.25" max="2" step="0.05"><output for="speed"></output></label>
      </div>
      <label class="gm-check"><input id="loop" type="checkbox"><span>循环播放</span></label>
    </section>

    <section class="gm-card">
      <div class="gm-card-title"><span>05</span><h2>时间轴</h2></div>
      <div class="me-choreo-scroll"><div id="timeline" class="gm-timeline me-choreo-track me-choreo-bar" role="list" aria-label="字融动效时间轴"></div></div>
      <input id="scrubber" class="gm-scrubber me-choreo-playhead" type="range" min="0" max="1" step="0.001" value="0" aria-label="时间轴播放头">
      <div class="gm-time-readout"><span id="timeNow">0.00s</span><span id="timeTotal">0.00s</span></div>
    </section>

    <section class="gm-card">
      <div class="gm-card-title"><span>06</span><h2>方案</h2></div>
      <div class="gm-actions gm-actions-4">
        <button id="saveScheme" type="button">保存</button>
        <button id="importScheme" type="button">导入</button>
        <button id="restoreScheme" type="button">恢复默认</button>
        <button id="clearScheme" type="button">清空</button>
      </div>
      <input id="schemeFile" type="file" accept="application/json,.json" hidden>
    </section>

    <section class="gm-card">
      <div class="gm-card-title"><span>07</span><h2>真实导出</h2></div>
      <div class="gm-grid-2">
        <label class="gm-field">时长
          <select id="exportDuration"><option value="cycle">完整循环</option><option value="3">3 秒</option><option value="5">5 秒</option><option value="10">10 秒</option></select>
        </label>
        <label class="gm-field">帧率
          <select id="exportFps"><option value="24">24 fps</option><option value="30" selected>30 fps</option><option value="60">60 fps</option></select>
        </label>
      </div>
      <div class="gm-actions gm-actions-3">
        <button id="exportPng" type="button">PNG</button>
        <button id="exportGif" type="button">GIF</button>
        <button id="exportMp4" type="button">MP4</button>
      </div>
      <p id="exportStatus" class="gm-status" aria-live="polite">输出将严格使用当前画布尺寸。</p>
    </section>
  </aside>

  <main id="glyphMorphStage" class="gm-stage">
    <div id="compositionFrame" class="gm-composition-frame">
      <canvas id="glyphMorphCanvas" width="1080" height="1080" aria-label="字融效果预览"></canvas>
    </div>
    <div class="gm-stage-controls me-stage-controls" aria-label="预览控制">
      <button id="toggleInspector" type="button" aria-pressed="false">▤ <span>编辑器</span></button>
      <i aria-hidden="true"></i>
      <button id="restartPreview" type="button">↺ <span>重播</span></button>
      <button id="togglePlayback" type="button" aria-pressed="false">Ⅱ <span>暂停</span></button>
    </div>
  </main>

  <dialog id="clearDialog" class="gm-clear-dialog" aria-labelledby="clearDialogTitle">
    <div class="gm-dialog-body">
      <div class="gm-dialog-heading">
        <div><small>清空方式</small><h2 id="clearDialogTitle">要清空什么？</h2></div>
        <button id="closeClearDialog" class="gm-dialog-close" aria-label="关闭" type="button">×</button>
      </div>
      <button id="clearChanges" class="gm-clear-choice" type="button">
        <strong>清空改动</strong>
        <span>撤销本次编辑，恢复首次打开时的默认文字、尺寸和参数。</span>
      </button>
      <button id="clearAll" class="gm-clear-choice gm-clear-choice-danger" type="button">
        <strong>清空所有内容</strong>
        <span>清空全部文字行，但保留当前画布、字体、颜色和动效参数。</span>
      </button>
    </div>
  </dialog>

  <script src="js/continuation-gif.js?v=20260824-1"></script>
  <script src="shared-font-library.js?v=20260824-2"></script>
  <script src="glyphmorph.js?v=20260901-2"></script>
  <script src="stg-cn.js?v=20260901-1"></script>
</body>
</html>
