<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>STG v.boxSquad</title>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/2.0.5/p5.min.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,slnt,wdth,wght,ROND@6..144,-10..0,25..151,1..1000,0..100&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">

  <script src="boxSquad_script/sketch_boxSquad.js" type="text/javascript"></script>
  <script src="boxSquad_script/animators.js" type="text/javascript"></script>
  <script src="boxSquad_script/class_boxSquad.js" type="text/javascript"></script>

  <link rel="stylesheet" href="boxSquad_script/style.css">
  <link rel="stylesheet" href="stg-cn.css">
</head>

<body>

<!-- FLOATING PANEL -->
<div id="panel">
  <div id="panel-header">
    <div class="panel-header-row">
      <span class="panel-title">STG v.boxSquad</span>
      <div class="panel-minimize" id="minimize-btn" title="Minimize">
        <svg width="10" height="2" viewBox="0 0 10 2" fill="none">
          <rect width="10" height="2" rx="1" fill="rgba(255,255,255,0.5)"/>
        </svg>
      </div>
    </div>
    <div class="panel-byline">a generator from <a href="https://www.instagram.com/kiel.d.m/" target="_blank">kielm</a> &middot; <span id="fps">--</span> fps</div>
  </div>

  <div id="panel-body">
    <div class="section-content" style="padding-top: 8px;">
      <label class="ctrl text-control" for="squad-text">
        <span class="ctrl-label">文字</span>
        <input type="text" id="squad-text" value="中文动效">
      </label>
      <div class="grid-steppers">
        <div class="stepper-col">
          <span class="stepper-label">Columns</span>
          <div class="stepper">
            <button class="stepper-btn" id="cols-minus">&minus;</button>
            <span class="stepper-val" id="cols-val">--</span>
            <button class="stepper-btn" id="cols-plus">+</button>
          </div>
        </div>
        <div class="stepper-col">
          <span class="stepper-label">Rows</span>
          <div class="stepper">
            <button class="stepper-btn" id="rows-minus">&minus;</button>
            <span class="stepper-val" id="rows-val">--</span>
            <button class="stepper-btn" id="rows-plus">+</button>
          </div>
        </div>
      </div>
      <div class="ctrl-grid">
        <div class="ctrl">
          <span class="ctrl-label">Twerk</span>
          <input type="checkbox" id="twerk-toggle">
        </div>
        <div class="ctrl">
          <span class="ctrl-label">B/W</span>
          <input type="checkbox" id="bw-toggle">
        </div>
        <div class="ctrl">
          <span class="ctrl-label">Checker</span>
          <input type="checkbox" id="checker-toggle">
        </div>
        <div class="ctrl">
          <span class="ctrl-label">Debug</span>
          <input type="checkbox" id="debug-toggle">
        </div>
      </div>
      <div class="btn-row">
        <button class="action-btn" id="reset-btn">Reset Grid</button>
        <button class="action-btn" id="reroll-btn">Reroll</button>
      </div>
    </div>
  </div>
</div>

<script>
  function updateFill(sl) {
    const min = parseFloat(sl.min), max = parseFloat(sl.max), val = parseFloat(sl.value);
    sl.style.setProperty('--fill', ((val - min) / (max - min) * 100) + '%');
  }

  // ── Flip-toggle switches ──
  document.getElementById('debug-toggle').addEventListener('change', e => {
    debugStroke = e.target.checked;
  });
  document.getElementById('twerk-toggle').addEventListener('change', e => {
    twerkMode = e.target.checked;
  });
  document.getElementById('bw-toggle').addEventListener('change', e => {
    if (typeof setBWMode === 'function') setBWMode(e.target.checked);
  });
  document.getElementById('checker-toggle').addEventListener('change', e => {
    checkerMode = e.target.checked;
  });
  document.getElementById('squad-text').addEventListener('input', e => {
    squadText = e.target.value || ' ';
  });

  // ── Action buttons ──
  document.getElementById('reset-btn').addEventListener('click', () => {
    if (typeof resetGrid === 'function') resetGrid();
  });
  document.getElementById('reroll-btn').addEventListener('click', () => {
    if (typeof rerollGrid === 'function') rerollGrid();
  });

  // ── Grid dimension steppers ──
  document.getElementById('cols-minus').addEventListener('click', () => { if (typeof adjustCols === 'function') adjustCols(-1); });
  document.getElementById('cols-plus') .addEventListener('click', () => { if (typeof adjustCols === 'function') adjustCols(+1); });
  document.getElementById('rows-minus').addEventListener('click', () => { if (typeof adjustRows === 'function') adjustRows(-1); });
  document.getElementById('rows-plus') .addEventListener('click', () => { if (typeof adjustRows === 'function') adjustRows(+1); });

  // ── Minimize ──
  document.getElementById('minimize-btn').addEventListener('click', e => {
    e.stopPropagation();
    const body = document.getElementById('panel-body');
    const btn  = document.getElementById('minimize-btn');
    const collapsed = body.classList.toggle('collapsed');
    btn.innerHTML = collapsed
      ? `<svg width="10" height="7" viewBox="0 0 10 7" fill="none"><path d="M1 6l4-4 4 4" stroke="rgba(255,255,255,0.5)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`
      : `<svg width="10" height="2" viewBox="0 0 10 2" fill="none"><rect width="10" height="2" rx="1" fill="rgba(255,255,255,0.5)"/></svg>`;
  });

  // ── Panel drag ──
  (function() {
    const panel  = document.getElementById('panel');
    const header = document.getElementById('panel-header');
    let dragging = false, ox = 0, oy = 0;
    header.addEventListener('mousedown', e => {
      if (window.innerWidth <= 600) return;   // bottom-sheet on mobile — no dragging
      dragging = true;
      const r = panel.getBoundingClientRect();
      ox = e.clientX - r.left;
      oy = e.clientY - r.top;
      panel.style.transition = 'none';
    });
    document.addEventListener('mousemove', e => {
      if (!dragging) return;
      panel.style.right = 'auto';
      panel.style.left = (e.clientX - ox) + 'px';
      panel.style.top  = (e.clientY - oy) + 'px';
    });
    document.addEventListener('mouseup', () => dragging = false);
  })();
</script>

  <script src="stg-cn.js?v=20260824-fonts1"></script>
</body>
</html>
