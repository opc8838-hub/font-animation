<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="揉纸入篓：文字变成纸张、被揉成纸团并旋转落入垃圾桶。"><title>揉纸入篓 Scrap Bin | ME Motion Studio</title><link rel="icon" href="data:,"><link rel="stylesheet" href="continuation.css"><link rel="stylesheet" href="currentwall.css"><link rel="stylesheet" href="focuswheel.css"><link rel="stylesheet" href="me-motion-editor.css"><link rel="stylesheet" href="scrapbin.css?v=20260815-1"><link rel="stylesheet" href="stg-cn.css"></head><body class="me-motion-editor">
<main class="current-stage scrap-bin-stage" aria-label="文字揉成纸团落入垃圾桶画布"><canvas id="scrapCanvas"></canvas><div class="canvas-mark" aria-hidden="true"><span id="frameCounter">F 0000</span><span>30 FPS</span></div></main>
<details class="control-panel current-panel scrap-bin-panel" open><summary><span><b>揉纸入篓</b><small>SCRAP BIN / 39</small></span><i aria-hidden="true">参数</i></summary><div class="panel-scroll">
<section><div class="section-heading"><p class="section-label">文字</p><small class="section-note">整句变成一张可揉皱的纸</small></div><input id="copyText" type="text" value="Scrap it."><div class="preset-actions"><button id="referencePreset" type="button">参考文案</button><button id="chinesePreset" type="button">中文示例</button><button id="restartTop" type="button">从头播放</button></div><p class="hint">已删除参考片里的短视频平台界面，只保留“文字 → 纸张 → 纸团 → 入篓”的核心动效。</p></section>
<section class="font-picker"><div class="sb-font-grid"><label><span class="section-label">字体</span><select id="fontFamily"><option value="inter" selected>Inter</option><option value="space">Space Grotesk</option><option value="manrope">Manrope</option><option value="poppins">Poppins</option><option value="noto">Noto Sans SC · 中文</option></select></label><label><span class="section-label">字重</span><select id="fontWeight"><option value="400" selected>Regular · 400</option><option value="500">Medium · 500</option><option value="600">Semibold · 600</option><option value="700">Bold · 700</option></select></label></div></section>
<section><div class="section-heading"><p class="section-label">动作时间线</p><small class="section-note">出现、揉皱、坠落分别编辑</small></div><div class="motion-map sb-motion-map"><span>文字与桶</span><i>→</i><span>揉成纸团</span><i>→</i><span>旋转入篓</span></div><div class="controls-grid quick-grid">
<label>整体速度 <output id="speedOut">1.00×</output><input id="speed" type="range" min="0.25" max="4" step="0.05" value="1"></label><label>文字停留 <output id="textHoldOut">1.40秒</output><input id="textHold" type="range" min="0" max="8000" step="20" value="1400"></label>
<label>垃圾桶出现 <output id="binInOut">0.70秒</output><input id="binIn" type="range" min="80" max="4000" step="10" value="700"></label><label>出现后停留 <output id="readyHoldOut">1.10秒</output><input id="readyHold" type="range" min="0" max="8000" step="20" value="1100"></label>
<label>揉纸时长 <output id="crumpleOut">0.65秒</output><input id="crumple" type="range" min="100" max="4000" step="10" value="650"></label><label>下落时长 <output id="fallOut">1.15秒</output><input id="fall" type="range" min="150" max="5000" step="10" value="1150"></label>
<label>废纸弹出 <output id="fillInOut">0.28秒</output><input id="fillIn" type="range" min="60" max="2000" step="10" value="280"></label><label>结果停留 <output id="resultHoldOut">2.20秒</output><input id="resultHold" type="range" min="0" max="10000" step="20" value="2200"></label>
<label>下落节奏 <select id="fallRhythm"><option value="gravity" selected>重力加速</option><option value="smooth">柔和落下</option><option value="bounce">入桶轻弹</option><option value="snap">快速丢入</option></select></label><label>旋转圈数 <output id="spinOut">1.35圈</output><input id="spin" type="range" min="-4" max="4" step="0.05" value="1.35"></label>
</div></section>
<section><div class="section-heading"><p class="section-label">纸团与垃圾桶</p><small class="section-note">位置、尺寸、皱褶和内容都可调</small></div><div class="controls-grid"><label>纸张宽度 <output id="paperWidthOut">125%</output><input id="paperWidth" type="range" min="70" max="220" value="125"></label><label>揉皱强度 <output id="wrinkleOut">72%</output><input id="wrinkle" type="range" min="0" max="100" value="72"></label><label>水平摆动 <output id="swayOut">35px</output><input id="sway" type="range" min="0" max="180" value="35"></label><label>垃圾桶大小 <output id="binSizeOut">120px</output><input id="binSize" type="range" min="50" max="260" value="120"></label><label>桶与文字间距 <output id="binGapOut">110px</output><input id="binGap" type="range" min="40" max="350" value="110"></label><label>桶透明度 <output id="binOpacityOut">64%</output><input id="binOpacity" type="range" min="10" max="100" value="64"></label><label>桶内废纸数量 <output id="scrapCountOut">9</output><input id="scrapCount" type="range" min="1" max="24" value="9"></label><label>废纸弹跳 <output id="scrapBounceOut">22px</output><input id="scrapBounce" type="range" min="0" max="90" value="22"></label></div></section>
<section><div class="section-heading"><p class="section-label">排版</p><small class="section-note">字组整体居中</small></div><div class="controls-grid"><label>字号 <output id="fontSizeOut">112px</output><input id="fontSize" type="range" min="24" max="280" value="112"></label><label>字距 <output id="trackingOut">-3px</output><input id="tracking" type="range" min="-18" max="46" value="-3"></label><label>水平位置 <output id="textXOut">50%</output><input id="textX" type="range" min="5" max="95" value="50"></label><label>垂直位置 <output id="textYOut">40%</output><input id="textY" type="range" min="10" max="80" value="40"></label></div></section>
<section class="color-row sb-colors"><label>背景<input id="backgroundColor" type="color" value="#000000"></label><label>文字<input id="textColor" type="color" value="#ffffff"></label><label>纸张<input id="paperColor" type="color" value="#f4f1eb"></label><label>垃圾桶<input id="binColor" type="color" value="#cfd1d5"></label></section>
<section class="transport"><button id="restartButton" type="button">重播</button><button id="pauseButton" type="button">暂停</button><button id="backButton" type="button">−1 帧</button><button id="forwardButton" type="button">+1 帧</button></section>
<section class="export-panel"><label class="section-label" for="exportPreset">导出尺寸</label><select id="exportPreset"><option value="current">当前画板</option><option value="1080x1080">1:1 · 1080 × 1080</option><option value="1080x1350">4:5 · 1080 × 1350</option><option value="1080x1920">9:16 · 1080 × 1920</option><option value="1920x1080">16:9 · 1920 × 1080</option><option value="custom">自定义尺寸</option></select><div class="custom-size" id="customSize" hidden><label>宽<input id="exportWidth" type="number" min="240" max="3840" value="1080"></label><span>×</span><label>高<input id="exportHeight" type="number" min="240" max="3840" value="1920"></label></div><div class="export-timing-grid"><label>导出时长<select id="exportDuration"><option value="cycle" selected>完整一轮</option><option value="3">3 秒</option><option value="5">5 秒</option><option value="10">10 秒</option><option value="custom">自定义</option></select></label><label>导出帧率<select id="exportFps"><option value="15">15 FPS</option><option value="24">24 FPS</option><option value="30" selected>30 FPS</option><option value="60">60 FPS</option></select></label></div><label class="custom-duration" id="customDurationWrap" hidden>自定义秒数<input id="customDuration" type="number" min="0.5" max="30" step="0.1" value="8"></label><div class="export-actions"><button id="exportPng" type="button">PNG 图片</button><button id="exportGif" type="button">GIF 动图</button><button id="exportVideo" type="button">视频</button><button class="export-hd-video" id="exportVerticalVideo" type="button">导出 9:16 高清视频 · 1080 × 1920</button></div><p class="export-status" id="exportStatus" aria-live="polite">纸张变形与重力下落使用确定性时间线。</p></section><p class="formula">文字成纸 × 多边形揉皱 × 重力旋转 × 入篓弹跳<br>不使用外部物理库，导出结果与预览一致</p>
</div></details><script src="js/continuation-gif.js"></script><script src="CCapture.all.min.js"></script><script src="scrapbin.js?v=20260824-fonts1"></script><script src="me-motion-editor.js"></script><script src="stg-cn.js?v=20260824-fonts1"></script></body></html>
