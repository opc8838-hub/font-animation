<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>font-test</title></head>
<body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.0.0/p5.min.js"></script>
<script>
let font;
function preload() {
  font = loadFont('assets/NotoSansSC-Regular.ttf',
    () => console.log('LOAD_OK'),
    (e) => console.log('LOAD_FAIL', e));
}
function setup() {
  createCanvas(800, 300);
  background(255); fill(0); noStroke();
  textFont(font); textSize(48);
  text('中文渲染测试', 40, 120);
  // 验证字形轮廓提取：每个字的 textToPoints 点数
  let report = [];
  for (const ch of ['中','文','渲','染','测','试','A','&']) {
    let pts = [];
    try { pts = font.textToPoints(ch, 0, 0, 48); } catch(e) { report.push(ch + ':ERR'); continue; }
    report.push(ch + ':' + pts.length);
  }
  document.title = 'RESULT|' + report.join('|');
  console.log('TITLE_RESULT', document.title);
}
</script>
</body>
</html>
