<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="description" content="双视频对比编辑器：Before / After 同步播放，自定义标签、取景与黑白版式。"><title>视频对比 Video Compare | CellMotion</title><link rel="icon" href="favicon.svg">
<link rel="stylesheet" href="workspace-editor.css?v=20260901-1"><link rel="stylesheet" href="me-motion-editor.css?v=20260909-timeline-color"><link rel="stylesheet" href="shared-fonts.css?v=20261006-garden1"><link rel="stylesheet" href="glyphmorph-reviewed.css?v=20260909-media-crop"><link rel="stylesheet" href="typecascade-workspace.css?v=20260909-coloriso"><link rel="stylesheet" href="typecascade-polish.css?v=20261006-garden1"><link rel="stylesheet" href="site-preferences.css?v=20260926-18"><link rel="stylesheet" href="video-compare.css?v=20261012-2"></head>
<body class="glyphmorph-editor video-compare-editor" data-editor-capabilities="fixed-video-pair">
<aside id="glyphMorphInspector" class="gm-inspector" aria-label="视频对比编辑器">
<header class="gm-header"><a class="tc-brand" href="cellmotion.html" aria-label="CellMotion 首页"><img src="assets/cellmotion/logo-original-transparent.png?v=20260926-1" alt="CellMotion"></a><div><h1><span data-vc-zh="视频对比" data-vc-en="Video Compare" data-no-translate>视频对比</span> <span data-no-translate>Before / After</span></h1></div></header>
<section class="gm-card gm-canvas-card"><div class="gm-card-title"><h2>画布尺寸</h2></div><label class="gm-field gm-field-wide"><span data-vc-zh="整体画布尺寸" data-vc-en="Output canvas size" data-no-translate>整体画布尺寸</span><select id="canvasPreset" aria-label="整体画布尺寸"><option value="1920x1080">16:9 · 1920 × 1080</option><option value="1440x1080">4:3 · 1440 × 1080</option><option value="1620x1080">3:2 · 1620 × 1080</option><option value="1080x1080">1:1 · 1080 × 1080</option><option value="1080x1920">9:16 · 1080 × 1920</option><option value="custom">自定义</option></select></label><div class="gm-grid-2 gm-custom-size" hidden><label class="gm-field">宽度<input id="canvasWidth" type="number" min="320" max="3840" step="2" value="1920"></label><label class="gm-field">高度<input id="canvasHeight" type="number" min="320" max="3840" step="2" value="1080"></label></div><p id="canvasStatus" class="gm-status" role="status" data-no-translate></p></section>
<section class="gm-card"><div class="gm-card-title"><h2>视频</h2><button id="addRow" type="button" hidden>添加</button></div><div id="sequenceRows" class="gm-sequence"></div></section>
<section class="gm-card"><div class="gm-card-title"><h2><span data-vc-zh="版式设置" data-vc-en="Layout" data-no-translate>版式设置</span></h2></div><div class="gm-grid-2"><label class="gm-field gm-field-wide"><span data-vc-zh="视频框比例" data-vc-en="Video frame aspect" data-no-translate>视频框比例</span><select id="videoAspect"><option value="auto">自动跟随素材 · 优先 After</option><option value="16:9">16:9 · 横屏视频</option><option value="9:16">9:16 · 竖屏视频</option></select></label><label class="gm-field gm-field-wide"><span data-vc-zh="Before 相对大小" data-vc-en="Before size relative to After" data-no-translate>Before 相对大小</span><input id="beforeScale" type="range" min="45" max="85" step="1" value="65"><output for="beforeScale">65%</output></label><label class="gm-field"><span data-vc-zh="字体" data-vc-en="Font" data-no-translate>字体</span><select id="fontFamily"><option value="stg:manrope">Manrope</option></select></label><label class="gm-field"><span data-vc-zh="画面配色" data-vc-en="Composition theme" data-no-translate>画面配色</span><select id="compositionTheme"><option value="light">白底 · 黑字</option><option value="dark">黑底 · 白字</option></select></label><label class="gm-field"><span data-vc-zh="文字颜色" data-vc-en="Text color" data-no-translate>文字颜色</span><input id="textColor" type="color" value="#171717"></label><label class="gm-field"><span data-vc-zh="背景颜色" data-vc-en="Background color" data-no-translate>背景颜色</span><input id="backgroundColor" type="color" value="#faf9f7"></label><label class="gm-field"><span data-vc-zh="字号" data-vc-en="Label size" data-no-translate>字号</span><input id="labelSize" type="range" min="60" max="160" value="100"><output for="labelSize">100%</output></label><label class="gm-field"><span data-vc-zh="边距" data-vc-en="Margins" data-no-translate>边距</span><input id="marginSize" type="range" min="3" max="10" step="0.5" value="5"><output for="marginSize">5%</output></label><label class="gm-field"><span data-vc-zh="视频间距" data-vc-en="Video gap" data-no-translate>视频间距</span><input id="frameGap" type="range" min="2" max="9" step="0.5" value="4"><output for="frameGap">4%</output></label><label class="gm-field"><span data-vc-zh="视频圆角" data-vc-en="Video corners" data-no-translate>视频圆角</span><input id="frameRadius" type="range" min="0" max="60" value="28"><output for="frameRadius">28px</output></label><label class="gm-field"><span data-vc-zh="Logo 大小" data-vc-en="Logo size" data-no-translate>Logo 大小</span><input id="logoSize" type="range" min="12" max="32" value="22"><output for="logoSize">22%</output></label></div><p id="videoAspectStatus" class="vc-note" data-no-translate></p><p class="gm-help"><span data-vc-zh="素材尺寸在各自上传栏显示。整体画布与视频框比例独立；默认完整显示，不拉伸。Before 始终小于 After。" data-vc-en="Source dimensions appear below each upload. Canvas and video frame aspects are independent. Fit inside preserves the full image without stretching. Before always stays smaller than After." data-no-translate>素材尺寸在各自上传栏显示。整体画布与视频框比例独立；默认完整显示，不拉伸。Before 始终小于 After。</span></p></section>
<section class="gm-card"><div class="gm-card-title"><h2>时间轴</h2></div><div class="me-choreo-scroll"><div id="timeline" class="gm-timeline me-choreo-track me-choreo-bar" role="list" aria-label="双视频播放时间轴"></div></div><input id="scrubber" class="gm-scrubber me-choreo-playhead" type="range" min="0" max="6000" step="1" value="0" aria-label="时间轴播放头"><div class="gm-time-readout"><span id="timeNow">0.00s</span><span id="timeTotal">6.00s</span></div></section>
<section class="gm-card"><div class="gm-card-title"><h2>方案</h2></div><div class="gm-actions gm-actions-4"><button id="saveScheme" type="button">保存方案</button><button id="importScheme" type="button">导入方案</button><button id="restoreScheme" type="button">恢复默认</button><button id="clearScheme" type="button">清理重做</button></div><input id="schemeFile" type="file" accept="application/json,.json" hidden><p id="schemeStatus" class="gm-status" role="status" data-no-translate></p></section>
<section class="gm-card"><div class="gm-card-title"><h2>导出</h2></div><div class="gm-grid-2"><label class="gm-field"><span data-vc-zh="时长" data-vc-en="Duration" data-no-translate>时长</span><select id="exportDuration"><option value="cycle">完整视频</option><option value="3">3 s</option><option value="5">5 s</option><option value="10">10 s</option><option value="custom">自定义</option></select></label><label class="gm-field"><span data-vc-zh="帧率" data-vc-en="Frame rate" data-no-translate>帧率</span><select id="exportFps"><option value="24">24 fps</option><option value="30" selected>30 fps</option><option value="60">60 fps</option></select></label><label class="gm-field" id="customDurationField" hidden><span data-vc-zh="时长 / 秒" data-vc-en="Duration / seconds" data-no-translate>时长 / 秒</span><input id="customDuration" type="number" min="0.1" max="120" step="0.1" value="6"></label><label class="gm-field"><span data-vc-zh="短视频结束后" data-vc-en="Short clip ending" data-no-translate>短视频结束后</span><select id="shortClip"><option value="hold">停在最后一帧</option><option value="loop">循环播放</option></select></label></div><p class="gm-help"><span data-vc-zh="完整视频采用两段素材中较长的时长。导出无声视频。" data-vc-en="Full duration uses the longer clip. Video exports are silent." data-no-translate>完整视频采用两段素材中较长的时长。导出无声视频。</span></p><div class="gm-actions gm-actions-3"><button id="exportPng" type="button">PNG</button><button id="exportGif" type="button">GIF</button><button id="exportMp4" type="button">MP4</button></div><button id="cancelExport" class="vc-secondary" type="button" hidden><span data-vc-zh="取消导出" data-vc-en="Cancel export" data-no-translate>取消导出</span></button><progress id="exportProgress" max="1" value="0" hidden></progress><p id="exportStatus" class="gm-status" role="status" data-no-translate></p></section></aside>
<main id="glyphMorphStage" class="gm-stage"><div id="compositionFrame" class="gm-composition-frame"><canvas id="glyphMorphCanvas" width="1920" height="1080" aria-label="双视频对比预览"></canvas></div><div class="gm-stage-controls me-stage-controls" aria-label="预览控制"><button id="toggleInspector" type="button" aria-pressed="false">▤ <span>编辑器</span></button><i aria-hidden="true"></i><button id="restartPreview" type="button">↺ <span>重播</span></button><button id="togglePlayback" type="button" aria-pressed="true">▶ <span>播放</span></button></div></main>
<script src="js/continuation-gif.js?v=20260824-1"></script><script src="shared-font-library.js?v=20261006-garden1"></script><script src="video-compare.js?v=20261012-2"></script><script src="typecascade-workspace.js?v=20261006-notr1"></script><script src="typecascade-polish.js?v=20260909-coloriso"></script><script src="typecascade-selects.js?v=20260909-1"></script><script src="typecascade-locale.js?v=20261010-sd3"></script><script defer src="site-preferences.js?v=20261006-spot"></script></body></html>
