<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="图片对比：先排原图和效果图，再生成到 100%，连贯切到成片。">
  <title>图片对比 Before After | ME Motion Studio</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&amp;f[]=general-sans@400,500,600&amp;display=swap">
  <link rel="stylesheet" href="continuation.css?v=20260824-ba1">
  <link rel="stylesheet" href="currentwall.css?v=20260824-ba1">
  <link rel="stylesheet" href="beforeafter.css?v=20260824-slider6">
  <link rel="stylesheet" href="me-motion-editor.css?v=20260824-ba1">
  <link rel="stylesheet" href="stg-cn.css?v=20260824-ba1">
</head>
<body class="me-motion-editor">
  <main class="current-stage beforeafter-stage" aria-label="图片对比动效画布">
    <div class="ba-phone">
      <canvas id="flowCanvas"></canvas>
    </div>
    <div class="canvas-mark" aria-hidden="true"><span id="frameCounter">F 0000</span><span>30 FPS</span></div>
    <div class="me-stage-controls" aria-label="画布播放控制">
      <button id="stagePauseButton" type="button" aria-pressed="false"><span id="stagePauseIcon">Ⅱ</span> <span id="stagePauseLabel">暂停</span></button>
      <button id="stageRestartButton" type="button">↻ 重播</button>
    </div>
  </main>

  <details class="control-panel current-panel beforeafter-panel" id="controlPanel" open>
    <summary>
      <span><b>图片对比</b><small>BEFORE AFTER / 35</small></span>
      <i aria-hidden="true">参数</i>
    </summary>
    <div class="panel-scroll">
      <section class="ba-block scheme-section">
        <p class="section-label">方案</p>
        <div class="me-scheme-actions">
          <button id="saveButton" type="button">保存方案</button>
          <label class="me-scheme-import">导入方案<input id="importFile" type="file" accept="application/json,.json"></label>
          <button id="resetButton" type="button">恢复默认</button>
          <button id="clearButton" type="button">清理重做</button>
        </div>
        <p class="hint ba-scheme-status" id="schemeStatus" aria-live="polite">图片、取景、滑杆阶段与时间都会随方案保存。</p>
      </section>

      <section class="ba-block">
        <div class="section-heading">
          <p class="section-label">图片</p>
          <small class="section-note">原图 · 效果图</small>
        </div>
        <div class="ba-uploads">
          <label class="ba-upload">
            <span>原图</span>
            <input id="beforeFile" type="file" accept="image/*">
            <small id="beforeName">默认风景原图</small>
          </label>
          <label class="ba-upload">
            <span>效果图</span>
            <input id="afterFile" type="file" accept="image/*">
            <small id="afterName">默认风景效果图</small>
          </label>
        </div>
      </section>

      <section class="ba-block">
        <div class="section-heading">
          <p class="section-label">文字</p>
          <small class="section-note">标签 · 字体 · 上下空</small>
        </div>
        <div class="search-row">
          <label>上标签<input id="beforeLabel" type="text" value="Before" spellcheck="false"></label>
          <label>下标签<input id="afterLabel" type="text" value="After" spellcheck="false"></label>
        </div>
        <div class="color-row ba-text-colors">
          <label>BEFORE 字色<input id="beforeColor" type="color" value="#111111"></label>
          <label>AFTER 字色<input id="afterColor" type="color" value="#111111"></label>
          <label>进度环<input id="ringColor" type="color" value="#ff6b9a"></label>
          <label>百分数 <output id="percentColorOut">#111111</output><input id="percentColor" type="color" value="#111111" oninput="var o=document.getElementById('percentColorOut'); if(o) o.textContent=this.value;"></label>
        </div>
        <div class="search-row">
          <label>BEFORE 字体
            <select id="beforeFont">
              <option value="space" selected>Space Grotesk</option>
              <option value="bebas">Bebas Neue · 仅大写</option>
              <option value="archivoBlack">Archivo Black</option>
              <option value="robotoCondensed">Roboto Condensed Bold</option>
              <option value="scRegular">Noto Sans SC Regular</option>
              <option value="scBlack">Noto Sans SC Black</option>
              <option value="serif">Lora Serif</option>
              <option value="mono">Martian Mono</option>
              <option value="fenix">Fenix</option>
              <option value="work">Work Sans</option>
              <option value="spaceMonoBold">Space Mono Bold</option>
              <option value="vollkornBoldItalic">Vollkorn Bold Italic</option>
              <option value="cairoBold">Cairo Bold</option>
              <option value="aguafina">Aguafina Script</option>
              <option value="manrope">Manrope</option>
              <option value="spartan">League Spartan</option>
              <option value="cinzel">Cinzel</option>
              <option value="instrument">Instrument Serif</option>
              <option value="poppins">Poppins</option>
              <option value="rajdhani">Rajdhani</option>
              <option value="teko">Teko</option>
              <option value="khand">Khand</option>
              <option value="fraunces">Fraunces</option>
              <option value="scThin">思源黑体 Thin</option>
              <option value="jpThin">Noto Sans JP Thin</option>
              <option value="jpBlack">Noto Sans JP Black</option>
              <option value="krBlack">Noto Sans KR Black</option>
            </select>
          </label>
          <label>AFTER 字体
            <select id="afterFont">
              <option value="space" selected>Space Grotesk</option>
              <option value="bebas">Bebas Neue · 仅大写</option>
              <option value="archivoBlack">Archivo Black</option>
              <option value="robotoCondensed">Roboto Condensed Bold</option>
              <option value="scRegular">Noto Sans SC Regular</option>
              <option value="scBlack">Noto Sans SC Black</option>
              <option value="serif">Lora Serif</option>
              <option value="mono">Martian Mono</option>
              <option value="fenix">Fenix</option>
              <option value="work">Work Sans</option>
              <option value="spaceMonoBold">Space Mono Bold</option>
              <option value="vollkornBoldItalic">Vollkorn Bold Italic</option>
              <option value="cairoBold">Cairo Bold</option>
              <option value="aguafina">Aguafina Script</option>
              <option value="manrope">Manrope</option>
              <option value="spartan">League Spartan</option>
              <option value="cinzel">Cinzel</option>
              <option value="instrument">Instrument Serif</option>
              <option value="poppins">Poppins</option>
              <option value="rajdhani">Rajdhani</option>
              <option value="teko">Teko</option>
              <option value="khand">Khand</option>
              <option value="fraunces">Fraunces</option>
              <option value="scThin">思源黑体 Thin</option>
              <option value="jpThin">Noto Sans JP Thin</option>
              <option value="jpBlack">Noto Sans JP Black</option>
              <option value="krBlack">Noto Sans KR Black</option>
            </select>
          </label>
        </div>
        <div class="controls-grid ba-dense">
          <label>字号 <output id="labelSizeOut">100%</output>
            <input id="labelSize" type="range" min="60" max="180" step="2" value="100">
          </label>
          <label>字距 <output id="labelTrackingOut">8</output>
            <input id="labelTracking" type="range" min="-8" max="28" step="1" value="8">
          </label>
          <label>文字上下空 <output id="labelPadOut">24</output>
            <input id="labelPad" type="range" min="0" max="80" step="1" value="24">
          </label>
          <label>BEFORE 上下 <output id="beforeShiftOut">0</output>
            <input id="beforeShift" type="range" min="-80" max="80" step="1" value="0">
          </label>
          <label>AFTER 上下 <output id="afterShiftOut">0</output>
            <input id="afterShift" type="range" min="-80" max="80" step="1" value="0">
          </label>
        </div>
      </section>

      <section class="ba-block">
        <div class="section-heading">
          <p class="section-label">首页构图</p>
          <small class="section-note">固定版式 · 按比例放大缩小</small>
        </div>
        <div class="controls-grid ba-dense">
          <label>图片比例 <output id="frameScaleOut">118%</output>
            <input id="frameScale" type="range" min="90" max="140" step="1" value="118">
          </label>
        </div>
        <div class="ba-pair">
          <div class="ba-col">
            <p class="ba-col-title">原图取景</p>
            <label>左右 <output id="beforePanXOut">居中</output>
              <input id="beforePanX" type="range" min="-100" max="100" step="1" value="0">
            </label>
            <label>上下 <output id="beforePanYOut">居中</output>
              <input id="beforePanY" type="range" min="-100" max="100" step="1" value="0">
            </label>
          </div>
          <div class="ba-col">
            <p class="ba-col-title">效果图取景</p>
            <label>左右 <output id="afterPanXOut">居中</output>
              <input id="afterPanX" type="range" min="-100" max="100" step="1" value="0">
            </label>
            <label>上下 <output id="afterPanYOut">居中</output>
              <input id="afterPanY" type="range" min="-100" max="100" step="1" value="0">
            </label>
          </div>
        </div>
      </section>

      <section class="ba-block ba-slider-section">
        <div class="section-heading">
          <p class="section-label">滑动对比 · 第二阶段</p>
          <small class="section-note">可选 · 画面可直接拖动</small>
        </div>
        <div class="ba-slider-enable">
          <label class="ba-check"><input id="sliderEnabled" type="checkbox" checked><span>添加滑动对比阶段</span></label>
          <button id="previewSliderButton" type="button">直接预览</button>
        </div>
        <div class="controls-grid ba-dense" id="sliderControls">
          <label>滑杆起点 <output id="sliderStartOut">18%</output>
            <input id="sliderStart" type="range" min="2" max="98" step="1" value="18">
          </label>
          <label>滑杆终点 <output id="sliderEndOut">82%</output>
            <input id="sliderEnd" type="range" min="2" max="98" step="1" value="82">
          </label>
          <label>单程时间 <output id="sliderDurationOut">1.80秒</output>
            <input id="sliderDuration" type="range" min="300" max="5000" step="50" value="1800">
          </label>
          <label>阶段停留 <output id="sliderHoldOut">1.00秒</output>
            <input id="sliderHold" type="range" min="0" max="5000" step="50" value="1000">
          </label>
          <label>滑动方式
            <select id="sliderMode">
              <option value="roundTrip" selected>左右往返</option>
              <option value="oneWay">单向滑动</option>
            </select>
          </label>
          <label>手柄大小 <output id="sliderHandleSizeOut">44</output>
            <input id="sliderHandleSize" type="range" min="24" max="90" step="1" value="44">
          </label>
        </div>
        <div class="color-row ba-slider-colors">
          <label>分隔线<input id="sliderLineColor" type="color" value="#ffffff"></label>
        </div>
        <p class="hint">播放和导出会按起点、终点与时间自动滑动；进入该阶段后，也可直接在画面上左右拖动。</p>
      </section>

      <section class="motion-quick">
        <div class="section-heading"><p class="section-label">动效时间轴</p><small class="section-note">点一段可跳到该阶段</small></div>
        <div class="me-choreo-track" id="beforeAfterTimeline" aria-label="图片对比动效时间轴">
          <div class="me-choreo-scroll">
            <div class="me-choreo-bar" id="beforeAfterTimelineTrack"></div>
          </div>
          <ol class="me-choreo-legend" id="beforeAfterTimelineList"></ol>
        </div>
        <div class="controls-grid quick-grid">
          <label>对比停留 <small class="stage-tag">上下排好</small><output id="compareHoldOut">1.40秒</output>
            <input id="compareHold" type="range" min="400" max="4000" step="50" value="1400">
          </label>
          <label>生成时间 <small class="stage-tag">0 → 100%</small><output id="generateDurationOut">0.90秒</output>
            <input id="generateDuration" type="range" min="300" max="3000" step="50" value="900">
          </label>
          <label>100% 停留 <small class="stage-tag">再切效果图</small><output id="hundredHoldOut">0.80秒</output>
            <input id="hundredHold" type="range" min="0" max="3000" step="50" value="800">
          </label>
          <label>成片停留 <small class="stage-tag">切完</small><output id="resultHoldOut">1.60秒</output>
            <input id="resultHold" type="range" min="400" max="5000" step="50" value="1600">
          </label>
          <label>全局速度 <small class="stage-tag">整段</small><output id="speedOut">1.00×</output>
            <input id="speed" type="range" min="40" max="200" step="5" value="100">
          </label>
        </div>
      </section>

      <section class="advanced-controls">
        <div class="section-heading"><p class="section-label">镜头与样式</p><small class="section-note">进阶</small></div>
        <div class="controls-grid">
          <label>翻页时间 <output id="pageSwitchOut">0.40秒</output>
            <input id="pageSwitch" type="range" min="120" max="1200" step="20" value="400">
          </label>
          <label>上传页停顿 <output id="uploadHoldOut">0.35秒</output>
            <input id="uploadHold" type="range" min="0" max="1500" step="50" value="350">
          </label>
          <label>飞入上传框 <output id="dropDurationOut">0.55秒</output>
            <input id="dropDuration" type="range" min="200" max="2000" step="50" value="550">
          </label>
          <label>切换柔度 <output id="cutSoftOut">0.18秒</output>
            <input id="cutSoft" type="range" min="0" max="500" step="10" value="180">
          </label>
          <label>卡片圆角 <output id="radiusOut">22px</output>
            <input id="radius" type="range" min="4" max="48" step="1" value="22">
          </label>
          <label>页边距 <output id="pagePadOut">7%</output>
            <input id="pagePad" type="range" min="3" max="14" step="1" value="7">
          </label>
        </div>
        <div class="color-row">
          <label>首页底<input id="compareBg" type="color" value="#ffffff"></label>
        </div>
      </section>

      <section class="transport" aria-label="时间轴控制">
        <button id="restartButton" type="button">重播</button>
        <button id="pauseButton" type="button">暂停</button>
        <button id="backButton" type="button">−1 帧</button>
        <button id="forwardButton" type="button">+1 帧</button>
      </section>

      <section class="export-panel">
        <label class="section-label" for="exportPreset">导出尺寸</label>
        <select id="exportPreset">
          <option value="1080x1920" selected>9:16 手机 · 1080 × 1920</option>
          <option value="current">当前手机框</option>
          <option value="1080x1080">1:1 · 1080 × 1080</option>
          <option value="1080x1350">4:5 · 1080 × 1350</option>
          <option value="1920x1080">16:9 · 1920 × 1080</option>
          <option value="custom">自定义尺寸</option>
        </select>
        <div class="custom-size" id="customSize" hidden>
          <label>宽<input id="exportWidth" type="number" min="240" max="3840" value="1080"></label><span>×</span>
          <label>高<input id="exportHeight" type="number" min="240" max="3840" value="1920"></label>
        </div>
        <div class="export-actions">
          <button id="exportPng" type="button">PNG 图片</button>
          <button id="exportGif" type="button">GIF 动图</button>
          <button id="exportVideo" type="button">导出 MP4</button>
          <button class="export-hd-video" id="exportVerticalVideo" type="button">导出 9:16 MP4 · 1080 × 1920</button>
        </div>
        <p class="export-status" id="exportStatus" aria-live="polite">导出按输出画布单独排版，不含左侧编辑器。</p>
      </section>
      <p class="formula">图片对比 → 生成效果 → 可选滑杆对比</p>
    </div>
  </details>

  <script src="js/continuation-gif.js"></script>
  <script src="js/h264-mp4-encoder.web.js"></script>
  <script src="beforeafter.js?v=20260824-slider6"></script>
  <script src="me-motion-editor.js?v=20260824-ba1"></script>
  <script src="stg-cn.js?v=20260824-ba1"></script>
</body>
</html>
