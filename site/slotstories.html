<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="字位剧场：图标在文字中开盒、替换与角色表演。"><title>字位剧场 Slot Stories | ME Motion Studio</title><link rel="icon" href="data:,"><link rel="stylesheet" href="continuation.css"><link rel="stylesheet" href="currentwall.css"><link rel="stylesheet" href="focuswheel.css"><link rel="stylesheet" href="me-motion-editor.css"><link rel="stylesheet" href="slotstories.css?v=20260815-1"><link rel="stylesheet" href="stg-cn.css"></head><body class="me-motion-editor">
<main class="current-stage slot-stories-stage" aria-label="文字字位图标表演画布"><canvas id="slotCanvas"></canvas><div class="canvas-mark" aria-hidden="true"><span id="frameCounter">F 0000</span><span>30 FPS</span></div></main>
<details class="control-panel current-panel slot-stories-panel" open><summary><span><b>字位剧场</b><small>SLOT STORIES / 41</small></span><i aria-hidden="true">参数</i></summary><div class="panel-scroll">
<section><div class="section-heading"><p class="section-label">三段文字</p><small class="section-note">每段都能指定图标替换字位</small></div><label class="stacked-control">第一段<input id="sceneAText" type="text" value="escape"></label><label class="stacked-control">第二段<input id="sceneBText" type="text" value="stories"></label><label class="stacked-control">第三段<input id="sceneCText" type="text" value="characters"></label><div class="preset-actions"><button id="referencePreset" type="button">参考文案</button><button id="chinesePreset" type="button">中文示例</button><button id="restartTop" type="button">从头播放</button></div><p class="hint">原视频的社交平台 UI 与品牌商标均已移除，图标使用项目已有素材或用户上传内容。</p></section>
<section class="font-picker"><div class="ss-font-grid"><label><span class="section-label">字体</span><select id="fontFamily"><option value="inter" selected>Inter</option><option value="space">Space Grotesk</option><option value="manrope">Manrope</option><option value="poppins">Poppins</option><option value="noto">Noto Sans SC · 中文</option></select></label><label><span class="section-label">字重</span><select id="fontWeight"><option value="500">Medium · 500</option><option value="600" selected>Semibold · 600</option><option value="700">Bold · 700</option><option value="800">Extra Bold · 800</option></select></label></div></section>
<section><div class="section-heading"><p class="section-label">场景时间线</p><small class="section-note">开盒、擦屏、换词、角色表演</small></div><div class="motion-map ss-motion-map"><span>开盒弹出</span><i>→</i><span>白色擦屏</span><i>→</i><span>图标换词</span><i>→</i><span>角色入场</span></div><div class="controls-grid quick-grid"><label>整体速度 <output id="speedOut">1.00×</output><input id="speed" type="range" min="0.25" max="4" step="0.05" value="1"></label><label>开盒时长 <output id="caseOpenOut">1.15秒</output><input id="caseOpen" type="range" min="100" max="5000" step="10" value="1150"></label><label>第一段停留 <output id="sceneAHoldOut">0.70秒</output><input id="sceneAHold" type="range" min="0" max="6000" step="10" value="700"></label><label>擦屏时长 <output id="wipeOut">0.42秒</output><input id="wipe" type="range" min="100" max="3000" step="10" value="420"></label><label>第二段停留 <output id="sceneBHoldOut">1.10秒</output><input id="sceneBHold" type="range" min="0" max="6000" step="10" value="1100"></label><label>第三段入场 <output id="sceneCInOut">0.65秒</output><input id="sceneCIn" type="range" min="100" max="4000" step="10" value="650"></label><label>角色表演 <output id="sceneCHoldOut">2.25秒</output><input id="sceneCHold" type="range" min="0" max="10000" step="10" value="2250"></label><label>擦屏节奏 <select id="wipeRhythm"><option value="elastic" selected>柔软横向拉开</option><option value="clean">干净直切</option><option value="flash">白色闪切</option><option value="wave">波浪擦除</option></select></label><label>角色动作 <select id="characterMotion"><option value="turn" selected>转身摆动</option><option value="bounce">上下弹跳</option><option value="float">轻柔漂浮</option><option value="still">静止</option></select></label></div></section>
<section><div class="section-heading"><p class="section-label">字位与素材</p><small class="section-note">字位从 1 开始，超出会自动夹取</small></div><div class="controls-grid"><label>第一段替换字位 <output id="slotAOut">4</output><input id="slotA" type="range" min="1" max="20" value="4"></label><label>第二段图标 A 字位 <output id="slotB1Out">3</output><input id="slotB1" type="range" min="1" max="20" value="3"></label><label>第二段图标 B 字位 <output id="slotB2Out">5</output><input id="slotB2" type="range" min="1" max="20" value="5"></label><label>第三段图标字位 <output id="slotC1Out">5</output><input id="slotC1" type="range" min="1" max="20" value="5"></label><label>第三段角色字位 <output id="slotC2Out">8</output><input id="slotC2" type="range" min="1" max="20" value="8"></label><label>图标 A<select id="iconA"><option value="case" selected>开盒耳机</option><option value="music">音乐</option><option value="play">播放</option><option value="cloud">云朵</option><option value="watch">手表</option><option value="animal-01">动物 01</option><option value="animal-08">动物 08</option><option value="uploadA">上传素材 A</option></select></label><label>图标 B<select id="iconB"><option value="play" selected>播放</option><option value="music">音乐</option><option value="cloud">云朵</option><option value="watch">手表</option><option value="animal-15">动物 15</option><option value="animal-23">动物 23</option><option value="uploadB">上传素材 B</option></select></label><label>角色素材<select id="characterIcon"><option value="animal-23" selected>动物 23</option><option value="animal-01">动物 01</option><option value="animal-08">动物 08</option><option value="animal-15">动物 15</option><option value="music">音乐</option><option value="cloud">云朵</option><option value="uploadB">上传素材 B</option></select></label><label class="ss-upload">上传素材 A<input id="uploadA" type="file" accept="image/png,image/jpeg,image/webp,image/gif,image/svg+xml"></label><label class="ss-upload">上传素材 B<input id="uploadB" type="file" accept="image/png,image/jpeg,image/webp,image/gif,image/svg+xml"></label></div></section>
<section><div class="section-heading"><p class="section-label">排版与间距</p><small class="section-note">图标与文字保持同一基线</small></div><div class="controls-grid"><label>字号 <output id="fontSizeOut">132px</output><input id="fontSize" type="range" min="24" max="280" value="132"></label><label>字距 <output id="trackingOut">-7px</output><input id="tracking" type="range" min="-20" max="50" value="-7"></label><label>图标大小 <output id="iconSizeOut">94%</output><input id="iconSize" type="range" min="20" max="220" value="94"></label><label>图标槽宽 <output id="iconGapOut">92%</output><input id="iconGap" type="range" min="35" max="200" value="92"></label><label>水平位置 <output id="textXOut">50%</output><input id="textX" type="range" min="5" max="95" value="50"></label><label>垂直位置 <output id="textYOut">50%</output><input id="textY" type="range" min="5" max="95" value="50"></label><label>角色摆动幅度 <output id="motionAmountOut">24px</output><input id="motionAmount" type="range" min="0" max="120" value="24"></label><label>第三段横向入场 <output id="slideDistanceOut">70%</output><input id="slideDistance" type="range" min="0" max="160" value="70"></label></div></section>
<section class="color-row ss-colors"><label>第一幕背景<input id="darkColor" type="color" value="#000000"></label><label>后两幕背景<input id="lightColor" type="color" value="#ffffff"></label><label>第一幕文字<input id="lightText" type="color" value="#ffffff"></label><label>后两幕文字<input id="darkText" type="color" value="#050505"></label></section>
<section class="transport"><button id="restartButton" type="button">重播</button><button id="pauseButton" type="button">暂停</button><button id="backButton" type="button">−1 帧</button><button id="forwardButton" type="button">+1 帧</button></section>
<section class="export-panel"><label class="section-label" for="exportPreset">导出尺寸</label><select id="exportPreset"><option value="current">当前画板</option><option value="1080x1080">1:1 · 1080 × 1080</option><option value="1080x1350">4:5 · 1080 × 1350</option><option value="1080x1920">9:16 · 1080 × 1920</option><option value="1920x1080">16:9 · 1920 × 1080</option><option value="custom">自定义尺寸</option></select><div class="custom-size" id="customSize" hidden><label>宽<input id="exportWidth" type="number" min="240" max="3840" value="1080"></label><span>×</span><label>高<input id="exportHeight" type="number" min="240" max="3840" value="1920"></label></div><div class="export-timing-grid"><label>导出时长<select id="exportDuration"><option value="cycle" selected>完整一轮</option><option value="3">3 秒</option><option value="5">5 秒</option><option value="10">10 秒</option><option value="custom">自定义</option></select></label><label>导出帧率<select id="exportFps"><option value="15">15 FPS</option><option value="24">24 FPS</option><option value="30" selected>30 FPS</option><option value="60">60 FPS</option></select></label></div><label class="custom-duration" id="customDurationWrap" hidden>自定义秒数<input id="customDuration" type="number" min="0.5" max="30" step="0.1" value="7"></label><div class="export-actions"><button id="exportPng" type="button">PNG 图片</button><button id="exportGif" type="button">GIF 动图</button><button id="exportVideo" type="button">视频</button><button class="export-hd-video" id="exportVerticalVideo" type="button">导出 9:16 高清视频 · 1080 × 1920</button></div><p class="export-status" id="exportStatus" aria-live="polite">三幕字位替换与擦屏共用确定性时间线。</p></section><p class="formula">字位替换 × 开盒弹出 × 横向擦屏 × 角色表演<br>复用项目图标素材，画布不包含社交平台外壳</p>
</div></details><script src="js/continuation-gif.js"></script><script src="CCapture.all.min.js"></script><script src="slotstories.js?v=20260815-1"></script><script src="me-motion-editor.js"></script><script src="stg-cn.js?v=20260815-slotstories"></script></body></html>
