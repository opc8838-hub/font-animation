<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>字倾组件演示 | CellMotion</title>
  <link rel="icon" href="favicon.svg">
  <link rel="stylesheet" href="shared-fonts.css?v=20260824-2">
  <link rel="stylesheet" href="typecascade-component-demo.css?v=20260909-editor-shell">
  <script src="cellmotion-ai-manifest.js?v=20260909-ai-manifest" defer></script>
  <script src="cellmotion-player.js?v=20260909-ai-manifest" defer></script>
  <script src="typecascade-component-demo.js?v=20260909-editor-shell" defer></script>
</head>
<body>
  <header class="demo-header">
    <a class="demo-brand" href="cellmotion.html" aria-label="CellMotion 首页">
      <img class="demo-logo-dark" src="assets/cellmotion/logo-dark-original.png" alt="CellMotion">
      <img class="demo-logo-light" src="assets/cellmotion/logo-original.png" alt="" aria-hidden="true">
    </a>
    <span>COMPONENT / V1</span>
    <a class="demo-back" href="typecascade.html">返回编辑器</a>
  </header>
  <main>
    <section class="demo-intro">
      <p>AI COMPONENT PREVIEW</p>
      <h1>字倾 · Type Cascade</h1>
      <p class="demo-lead">这里展示可交给 AI 前端继续使用的真实组件。从编辑器进入时读取当前配置；直接打开时使用默认方案。</p>
    </section>

    <section class="demo-card" aria-labelledby="demoTitle">
      <div class="demo-card-head">
        <div><small>LIVE COMPONENT</small><h2 id="demoTitle">字倾 · Type Cascade</h2></div>
        <nav class="demo-tabs" aria-label="演示视图">
          <button type="button" data-tab="preview" aria-pressed="true">Preview</button>
          <button type="button" data-tab="code" aria-pressed="false">Code</button>
        </nav>
      </div>
      <div class="demo-panel" data-panel="preview">
        <div class="demo-stage"><cellmotion-player id="demoPlayer"></cellmotion-player></div>
        <div class="demo-controls" aria-label="播放器控制">
          <button type="button" data-player-action="play">播放</button>
          <button type="button" data-player-action="pause">暂停</button>
          <button type="button" data-player-action="restart">重播</button>
          <label>定位 <input id="demoSeek" type="range" min="0" max="10" step="0.05" value="0"></label>
        </div>
      </div>
      <div class="demo-panel" data-panel="code" hidden>
        <div class="demo-code-head"><span>Configured HTML</span><button id="copyDemoCode" type="button">复制代码</button></div>
        <pre><code id="demoCode">正在构造组件配置…</code></pre>
      </div>
      <p id="demoStatus" class="demo-status" role="status">正在加载默认方案…</p>
    </section>
  </main>
</body>
</html>
