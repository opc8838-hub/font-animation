<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="彩幕组句：逐词铺开并由紫红流动到明亮绿色的全画布文字动效。">
  <title>彩幕组句 Color Canvas | ME Motion Studio</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="continuation.css">
  <link rel="stylesheet" href="currentwall.css">
  <link rel="stylesheet" href="focuswheel.css">
  <link rel="stylesheet" href="me-motion-editor.css">
  <link rel="stylesheet" href="colorcanvas.css?v=20260815-1">
  <link rel="stylesheet" href="stg-cn.css">
</head>
<body class="me-motion-editor">
  <main class="current-stage color-canvas-stage" aria-label="彩色背景逐词组句画布">
    <canvas id="motionCanvas"></canvas>
    <div class="canvas-mark" aria-hidden="true"><span id="frameCounter">F 0000</span><span>30 FPS</span></div>
  </main>

  <details class="control-panel current-panel color-canvas-panel" open>
    <summary><span><b>彩幕组句</b><small>COLOR CANVAS / 37</small></span><i aria-hidden="true">参数</i></summary>
    <div class="panel-scroll">
      <section>
        <div class="section-heading"><p class="section-label">逐行文案</p><small class="section-note">每行一段 · 支持中英文</small></div>
        <textarea id="copyText" rows="5">Take&#10;your&#10;design&#10;anywhere.</textarea>
        <div class="preset-actions"><button id="referencePreset" type="button">参考文案</button><button id="chinesePreset" type="button">中文示例</button><button id="restartTop" type="button">从头播放</button></div>
        <p class="hint">参考视频中的 Pad、电脑、手势和软件界面均已移除；整个背景画布直接呈现文字和彩色弧面。</p>
      </section>

      <section class="font-picker"><div class="cc-font-grid">
        <label><span class="section-label">字体</span><select id="fontFamily"><option value="inter" selected>Inter</option><option value="space">Space Grotesk</option><option value="manrope">Manrope</option><option value="poppins">Poppins</option><option value="noto">Noto Sans SC · 中文</option></select></label>
        <label><span class="section-label">字重</span><select id="fontWeight"><option value="400">Regular · 400</option><option value="500">Medium · 500</option><option value="600" selected>Semibold · 600</option><option value="700">Bold · 700</option><option value="800">Extra Bold · 800</option></select></label>
      </div></section>

      <section>
        <div class="section-heading"><p class="section-label">动效时间线</p><small class="section-note">每段速度与停留独立编辑</small></div>
        <div class="motion-map cc-motion-map"><span>首词呼吸</span><i>→</i><span>逐行弹出</span><i>→</i><span>彩幕流动</span></div>
        <div class="controls-grid quick-grid">
          <label>整体速度 <output id="speedOut">1.00×</output><input id="speed" type="range" min="0.25" max="4" step="0.05" value="1"></label>
          <label>首词呼吸 <output id="introOut">1.25秒</output><input id="intro" type="range" min="150" max="5000" step="10" value="1250"></label>
          <label>逐行弹出 <output id="revealOut">1.50秒</output><input id="reveal" type="range" min="180" max="6000" step="10" value="1500"></label>
          <label>行间隔 <output id="staggerOut">180ms</output><input id="stagger" type="range" min="0" max="1200" step="10" value="180"></label>
          <label>紫色停留 <output id="purpleHoldOut">0.55秒</output><input id="purpleHold" type="range" min="0" max="5000" step="10" value="550"></label>
          <label>变绿时长 <output id="greenShiftOut">0.80秒</output><input id="greenShift" type="range" min="120" max="5000" step="10" value="800"></label>
          <label>绿色流动 <output id="flowHoldOut">2.20秒</output><input id="flowHold" type="range" min="200" max="10000" step="20" value="2200"></label>
          <label>弹出节奏 <select id="rhythm"><option value="spring" selected>快速弹出</option><option value="smooth">柔和滑入</option><option value="snap">瞬间切入</option><option value="wave">逐行波浪</option></select></label>
          <label>首词缩放 <output id="introScaleOut">185%</output><input id="introScale" type="range" min="80" max="350" value="185"></label>
          <label>弹出位移 <output id="revealOffsetOut">80px</output><input id="revealOffset" type="range" min="0" max="320" value="80"></label>
        </div>
      </section>

      <section>
        <div class="section-heading"><p class="section-label">文字布局</p><small class="section-note">每行保持独立位置</small></div>
        <div class="controls-grid">
          <label>字号 <output id="fontSizeOut">132px</output><input id="fontSize" type="range" min="28" max="300" value="132"></label>
          <label>行距 <output id="lineGapOut">0.78×</output><input id="lineGap" type="range" min="0.45" max="1.8" step="0.01" value="0.78"></label>
          <label>字距 <output id="trackingOut">-6px</output><input id="tracking" type="range" min="-20" max="50" value="-6"></label>
          <label>水平位置 <output id="textXOut">50%</output><input id="textX" type="range" min="0" max="100" value="50"></label>
          <label>垂直位置 <output id="textYOut">50%</output><input id="textY" type="range" min="0" max="100" value="50"></label>
          <label>排布方式 <select id="layout"><option value="reference" selected>参考错落</option><option value="left">全部左对齐</option><option value="center">全部居中</option><option value="right">全部右对齐</option></select></label>
          <label>文字宽度 <output id="textWidthOut">86%</output><input id="textWidth" type="range" min="30" max="100" value="86"></label>
          <label>文字透明度 <output id="textOpacityOut">92%</output><input id="textOpacity" type="range" min="10" max="100" value="92"></label>
        </div>
      </section>

      <section>
        <div class="section-heading"><p class="section-label">彩色背景</p><small class="section-note">单层 Canvas 连续流动</small></div>
        <div class="controls-grid">
          <label>流动速度 <output id="flowSpeedOut">1.00×</output><input id="flowSpeed" type="range" min="0" max="4" step="0.05" value="1"></label>
          <label>弧面大小 <output id="orbSizeOut">86%</output><input id="orbSize" type="range" min="20" max="180" value="86"></label>
          <label>弧面柔度 <output id="softnessOut">62%</output><input id="softness" type="range" min="0" max="100" value="62"></label>
          <label>背景亮度 <output id="brightnessOut">100%</output><input id="brightness" type="range" min="35" max="160" value="100"></label>
        </div>
      </section>

      <section class="color-row cc-colors"><label>暗色<input id="darkColor" type="color" value="#0d0011"></label><label>紫红<input id="purpleColor" type="color" value="#d915a4"></label><label>绿色<input id="greenColor" type="color" value="#91f42a"></label><label>文字<input id="textColor" type="color" value="#ffffff"></label></section>
      <section class="transport"><button id="restartButton" type="button">重播</button><button id="pauseButton" type="button">暂停</button><button id="backButton" type="button">−1 帧</button><button id="forwardButton" type="button">+1 帧</button></section>

      <section class="export-panel">
        <label class="section-label" for="exportPreset">导出尺寸</label>
        <select id="exportPreset"><option value="current">当前画板</option><option value="1080x1080">1:1 · 1080 × 1080</option><option value="1080x1350">4:5 · 1080 × 1350</option><option value="1080x1920">9:16 · 1080 × 1920</option><option value="1920x1080">16:9 · 1920 × 1080</option><option value="custom">自定义尺寸</option></select>
        <div class="custom-size" id="customSize" hidden><label>宽<input id="exportWidth" type="number" min="240" max="3840" value="1080"></label><span>×</span><label>高<input id="exportHeight" type="number" min="240" max="3840" value="1920"></label></div>
        <div class="export-timing-grid"><label>导出时长<select id="exportDuration"><option value="cycle" selected>完整一轮</option><option value="1">1 秒</option><option value="3">3 秒</option><option value="5">5 秒</option><option value="10">10 秒</option><option value="custom">自定义</option></select></label><label>导出帧率<select id="exportFps"><option value="15">15 FPS</option><option value="24">24 FPS</option><option value="30" selected>30 FPS</option><option value="60">60 FPS</option></select></label></div>
        <label class="custom-duration" id="customDurationWrap" hidden>自定义秒数<input id="customDuration" type="number" min="0.5" max="30" step="0.1" value="5"></label>
        <div class="export-actions"><button id="exportPng" type="button">PNG 图片</button><button id="exportGif" type="button">GIF 动图</button><button id="exportVideo" type="button">视频</button><button class="export-hd-video" id="exportVerticalVideo" type="button">导出 9:16 高清视频 · 1080 × 1920</button></div>
        <p class="export-status" id="exportStatus" aria-live="polite">逐行文字与彩色背景共用一条确定性时间线。</p>
      </section>
      <p class="formula">首词呼吸 × 逐行弹出 × 彩幕流动<br>设备外壳已删除，所有动作都直接发生在完整画布内</p>
    </div>
  </details>

  <script src="js/continuation-gif.js"></script><script src="CCapture.all.min.js"></script><script src="colorcanvas.js?v=20260824-fonts1"></script><script src="me-motion-editor.js"></script><script src="stg-cn.js?v=20260824-fonts1"></script>
</body>
</html>
