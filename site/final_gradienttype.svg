<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">渐字 Gradient Type</title>
  <desc id="desc">紫红橙色流动渐变上的白色逐字输入预览</desc>
  <defs>
    <linearGradient id="sunset" x1="0" y1="0" x2="0.82" y2="1">
      <stop offset="0" stop-color="#d800d5"/>
      <stop offset="0.28" stop-color="#ff006f"/>
      <stop offset="0.58" stop-color="#ff2e19"/>
      <stop offset="1" stop-color="#f39668"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#5a1630" flood-opacity="0.7"/>
    </filter>
  </defs>
  <rect width="1200" height="800" fill="url(#sunset)"/>
  <g fill="#fff" font-family="Arial, sans-serif" text-anchor="middle" filter="url(#shadow)">
    <text x="600" y="390" font-size="58">Obsession isn't a flaw.</text>
    <rect x="918" y="338" width="5" height="68" rx="2" fill="#fff"/>
  </g>
  <g fill="#fff" font-family="Arial, sans-serif" font-size="18" letter-spacing="4" opacity="0.75">
    <text x="42" y="58">GRADIENT TYPE</text>
    <text x="1015" y="748">35 / ME</text>
  </g>
</svg>
