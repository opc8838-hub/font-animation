<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="终端署名：输入、回删、图标弹出和品牌名二次输入。"><title>终端署名 Terminal Brand | ME Motion Studio</title><link rel="icon" href="data:,"><link rel="stylesheet" href="continuation.css"><link rel="stylesheet" href="currentwall.css"><link rel="stylesheet" href="focuswheel.css"><link rel="stylesheet" href="me-motion-editor.css"><link rel="stylesheet" href="terminalbrand.css?v=20260815-1"><link rel="stylesheet" href="stg-cn.css"></head><body class="me-motion-editor">
<main class="current-stage terminal-brand-stage" aria-label="终端输入与品牌署名画布"><canvas id="terminalCanvas"></canvas><div class="canvas-mark" aria-hidden="true"><span id="frameCounter">F 0000</span><span>30 FPS</span></div></main>
<details class="control-panel current-panel terminal-brand-panel" open><summary><span><b>终端署名</b><small>TERMINAL BRAND / 40</small></span><i aria-hidden="true">参数</i></summary><div class="panel-scroll">
<section><div class="section-heading"><p class="section-label">两段文案</p><small class="section-note">输入第一句 → 回删 → 图标与署名</small></div><label class="stacked-control">第一句<input id="introText" type="text" value="hey there."></label><label class="stacked-control">品牌 / 署名<input id="brandText" type="text" value="Composio"></label><div class="preset-actions"><button id="referencePreset" type="button">参考文案</button><button id="chinesePreset" type="button">中文示例</button><button id="restartTop" type="button">从头播放</button></div><p class="hint">参考片中的 X 平台界面、账号、按钮和手机状态栏均已移除。</p></section>
<section class="font-picker"><div class="tb-font-grid"><label><span class="section-label">字体</span><select id="fontFamily"><option value="space" selected>Space Grotesk</option><option value="inter">Inter</option><option value="manrope">Manrope</option><option value="poppins">Poppins</option><option value="noto">Noto Sans SC · 中文</option></select></label><label><span class="section-label">字重</span><select id="fontWeight"><option value="400">Regular · 400</option><option value="500" selected>Medium · 500</option><option value="600">Semibold · 600</option><option value="700">Bold · 700</option></select></label></div></section>
<section><div class="section-heading"><p class="section-label">输入时间线</p><small class="section-note">每一段速度都能独立调整</small></div><div class="motion-map tb-motion-map"><span>输入问候</span><i>→</i><span>逐字回删</span><i>→</i><span>图标 + 署名</span></div><div class="controls-grid quick-grid"><label>整体速度 <output id="speedOut">1.00×</output><input id="speed" type="range" min="0.25" max="4" step="0.05" value="1"></label><label>第一句输入 <output id="introTypeOut">1.40秒</output><input id="introType" type="range" min="100" max="6000" step="10" value="1400"></label><label>第一句停留 <output id="introHoldOut">0.55秒</output><input id="introHold" type="range" min="0" max="6000" step="10" value="550"></label><label>回删时长 <output id="deleteTimeOut">0.85秒</output><input id="deleteTime" type="range" min="100" max="5000" step="10" value="850"></label><label>图标弹出 <output id="iconInOut">0.28秒</output><input id="iconIn" type="range" min="50" max="2500" step="10" value="280"></label><label>品牌名输入 <output id="brandTypeOut">0.85秒</output><input id="brandType" type="range" min="100" max="6000" step="10" value="850"></label><label>品牌名停留 <output id="brandHoldOut">1.35秒</output><input id="brandHold" type="range" min="0" max="8000" step="10" value="1350"></label><label>淡出时长 <output id="fadeOutOut">0.45秒</output><input id="fadeOut" type="range" min="60" max="3000" step="10" value="450"></label><label>输入节奏 <select id="cadence"><option value="human" selected>自然停顿</option><option value="linear">均匀输入</option><option value="burst">瞬间加速</option><option value="word">逐词跳入</option></select></label><label>光标闪烁 <output id="cursorRateOut">2.0Hz</output><input id="cursorRate" type="range" min="0" max="8" step="0.1" value="2"></label></div></section>
<section><div class="section-heading"><p class="section-label">图标 / 图片</p><small class="section-note">复用项目图标与透明动物</small></div><div class="controls-grid"><label>图标素材<select id="iconPreset"><option value="brand" selected>几何品牌标</option><option value="music">音乐</option><option value="play">播放</option><option value="cloud">云朵</option><option value="watch">手表</option><option value="animal-01">透明动物 01</option><option value="animal-08">透明动物 08</option><option value="animal-15">透明动物 15</option><option value="animal-23">透明动物 23</option><option value="upload">用户上传</option></select></label><label class="tb-upload">上传图片 / GIF<input id="iconUpload" type="file" accept="image/png,image/jpeg,image/webp,image/gif,image/svg+xml"></label><label>图标大小 <output id="iconSizeOut">82%</output><input id="iconSize" type="range" min="20" max="220" value="82"></label><label>图标文字间距 <output id="iconGapOut">18px</output><input id="iconGap" type="range" min="-30" max="140" value="18"></label><label>图标水平微调 <output id="iconXOut">0px</output><input id="iconX" type="range" min="-100" max="100" value="0"></label><label>图标垂直微调 <output id="iconYOut">0px</output><input id="iconY" type="range" min="-100" max="100" value="0"></label></div></section>
<section><div class="section-heading"><p class="section-label">排版与氛围</p><small class="section-note">参考片十字辅助线可开关</small></div><div class="controls-grid"><label>字号 <output id="fontSizeOut">118px</output><input id="fontSize" type="range" min="24" max="280" value="118"></label><label>字距 <output id="trackingOut">-4px</output><input id="tracking" type="range" min="-18" max="46" value="-4"></label><label>水平位置 <output id="textXOut">50%</output><input id="textX" type="range" min="5" max="95" value="50"></label><label>垂直位置 <output id="textYOut">50%</output><input id="textY" type="range" min="5" max="95" value="50"></label><label>光晕强度 <output id="glowOut">72%</output><input id="glow" type="range" min="0" max="140" value="72"></label><label>辅助线透明度 <output id="guidesOut">10%</output><input id="guides" type="range" min="0" max="60" value="10"></label></div></section>
<section class="color-row tb-colors"><label>背景<input id="backgroundColor" type="color" value="#000000"></label><label>文字<input id="textColor" type="color" value="#17f6ed"></label><label>光标<input id="cursorColor" type="color" value="#5ffdf8"></label><label>辅助线<input id="guideColor" type="color" value="#315a59"></label></section>
<section class="transport"><button id="restartButton" type="button">重播</button><button id="pauseButton" type="button">暂停</button><button id="backButton" type="button">−1 帧</button><button id="forwardButton" type="button">+1 帧</button></section>
<section class="export-panel"><label class="section-label" for="exportPreset">导出尺寸</label><select id="exportPreset"><option value="current">当前画板</option><option value="1080x1080">1:1 · 1080 × 1080</option><option value="1080x1350">4:5 · 1080 × 1350</option><option value="1080x1920">9:16 · 1080 × 1920</option><option value="1920x1080">16:9 · 1920 × 1080</option><option value="custom">自定义尺寸</option></select><div class="custom-size" id="customSize" hidden><label>宽<input id="exportWidth" type="number" min="240" max="3840" value="1080"></label><span>×</span><label>高<input id="exportHeight" type="number" min="240" max="3840" value="1920"></label></div><div class="export-timing-grid"><label>导出时长<select id="exportDuration"><option value="cycle" selected>完整一轮</option><option value="3">3 秒</option><option value="5">5 秒</option><option value="10">10 秒</option><option value="custom">自定义</option></select></label><label>导出帧率<select id="exportFps"><option value="15">15 FPS</option><option value="24">24 FPS</option><option value="30" selected>30 FPS</option><option value="60">60 FPS</option></select></label></div><label class="custom-duration" id="customDurationWrap" hidden>自定义秒数<input id="customDuration" type="number" min="0.5" max="30" step="0.1" value="6"></label><div class="export-actions"><button id="exportPng" type="button">PNG 图片</button><button id="exportGif" type="button">GIF 动图</button><button id="exportVideo" type="button">视频</button><button class="export-hd-video" id="exportVerticalVideo" type="button">导出 9:16 高清视频 · 1080 × 1920</button></div><p class="export-status" id="exportStatus" aria-live="polite">输入、回删和署名共用确定性字符时间线。</p></section><p class="formula">字符节奏 × 光标闪烁 × 图标弹出 × 署名输入<br>只绘制当前可见字符，后台标签页停止动画</p>
</div></details><script src="js/continuation-gif.js"></script><script src="CCapture.all.min.js"></script><script src="terminalbrand.js?v=20260815-1"></script><script src="me-motion-editor.js"></script><script src="stg-cn.js?v=20260815-terminalbrand"></script></body></html>
