<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="轨书：文字从直线弯入路径、沿曲线书写与滑行的动态字体编辑器。">
  <title>轨书 Path Writer | STG 中文版</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&amp;f[]=general-sans@400,500,600&amp;f[]=clash-display@500,600&amp;f[]=cabinet-grotesk@500,700&amp;display=swap">
  <link rel="stylesheet" href="continuation.css">
  <link rel="stylesheet" href="currentwall.css">
  <link rel="stylesheet" href="pathwriter.css?v=1">
  <link rel="stylesheet" href="me-motion-editor.css">
  <link rel="stylesheet" href="stg-cn.css">
</head>
<body class="me-motion-editor">
  <main class="current-stage writer-stage" aria-label="轨书动效画布">
    <canvas id="flowCanvas"></canvas>
    <div class="canvas-mark" aria-hidden="true"><span id="frameCounter">F 0000</span><span>30 FPS</span></div>
  </main>

  <details class="control-panel current-panel writer-panel" id="controlPanel" open>
    <summary><span><b>轨书</b><small>PATH WRITER / 28</small></span><i aria-hidden="true">参数</i></summary>
    <div class="panel-scroll">
      <section>
        <label class="section-label" for="phrasesInput">句子 · 每行一句</label>
        <textarea id="phrasesInput" rows="5" spellcheck="false">Write it.
Scrap it.</textarea>
        <p class="hint">每句话依次完成：逐字写入 → 直线弯曲 → 沿轨迹滑行 → 淡出并切换下一句。支持中英文。</p>
      </section>

      <section class="font-picker">
        <label class="section-label" for="fontFamily">字体</label>
        <select id="fontFamily">
          <optgroup label="Snap 动效字体">
            <option value="snap-inter-medium" selected>Inter Medium</option>
            <option value="snap-inter-black">Inter Black</option>
            <option value="snap-ibm-plex">IBM Plex Mono Bold Italic</option>
            <option value="snap-space-mono">Space Mono Bold</option>
            <option value="snap-space-grotesk">Space Grotesk Bold</option>
          </optgroup>
          <optgroup label="Free Faces · OFL">
            <option value="ff-space-grotesk">Space Grotesk</option>
            <option value="ff-martian-mono">Martian Mono</option>
            <option value="ff-oi">Oi Display</option>
            <option value="ff-barriecito">Barriecito</option>
          </optgroup>
          <optgroup label="UNCUT · OFL">
            <option value="uncut-berlin">Berlin Grotesk</option>
            <option value="uncut-berlin-bold">Berlin Grotesk Bold</option>
          </optgroup>
          <optgroup label="Fontshare · 官方 API">
            <option value="fs-satoshi">Satoshi</option>
            <option value="fs-general-sans">General Sans</option>
            <option value="fs-clash-display">Clash Display</option>
            <option value="fs-cabinet">Cabinet Grotesk</option>
          </optgroup>
          <optgroup label="中文字体">
            <option value="cn-noto-regular">Noto Sans SC</option>
            <option value="cn-noto-black">Noto Sans SC Black</option>
          </optgroup>
        </select>
      </section>

      <section class="motion-quick">
        <div class="section-heading"><p class="section-label">画面与路径</p><small class="section-note">参考视频约 4.2 秒</small></div>
        <div class="motion-map writer-motion-map" aria-label="动效阶段">
          <span>输入</span><i>→</i><span>弯曲</span><i>→</i><span>贴轨</span><i>→</i><span>滑出</span>
        </div>
        <div class="controls-grid quick-grid">
          <label>字号 <output id="fontSizeOut">76</output><input id="fontSize" type="range" min="24" max="180" value="76"></label>
          <label>字间距 <output id="letterSpacingOut">1</output><input id="letterSpacing" type="range" min="-8" max="30" step="0.5" value="1"></label>
          <label>波浪高度 <output id="amplitudeOut">92</output><input id="amplitude" type="range" min="0" max="260" value="92"></label>
          <label>波浪数量 <output id="wavesOut">1.35</output><input id="waves" type="range" min="0.5" max="3" step="0.05" value="1.35"></label>
          <label>轨迹宽度 <output id="pathWidthOut">76%</output><input id="pathWidth" type="range" min="45" max="130" value="76"></label>
          <label>整体倾斜 <output id="tiltOut">-12°</output><input id="tilt" type="range" min="-45" max="45" value="-12"></label>
          <label>轨迹粗细 <output id="lineWidthOut">1.2</output><input id="lineWidth" type="range" min="0.4" max="6" step="0.1" value="1.2"></label>
          <label>发光强度 <output id="glowOut">72%</output><input id="glow" type="range" min="0" max="150" value="72"></label>
        </div>
      </section>

      <section class="timing-editor">
        <div class="section-heading"><p class="section-label">动效时间</p><output id="cycleDurationOut">4.20 秒</output></div>
        <div class="timeline-strip" aria-hidden="true"><span data-phase="type"></span><span data-phase="bend"></span><span data-phase="hold"></span><span data-phase="ride"></span><span data-phase="fade"></span><i id="timelinePlayhead"></i></div>
        <div class="controls-grid timing-grid">
          <label>逐字输入 <output id="typeDurationOut">1.40秒</output><input id="typeDuration" type="range" min="300" max="4000" step="50" value="1400"></label>
          <label>弯曲成形 <output id="bendDurationOut">0.80秒</output><input id="bendDuration" type="range" min="200" max="3000" step="50" value="800"></label>
          <label>贴轨停留 <output id="holdDurationOut">0.30秒</output><input id="holdDuration" type="range" min="0" max="3000" step="50" value="300"></label>
          <label>沿轨滑行 <output id="rideDurationOut">1.20秒</output><input id="rideDuration" type="range" min="300" max="5000" step="50" value="1200"></label>
          <label>淡出切换 <output id="fadeDurationOut">0.50秒</output><input id="fadeDuration" type="range" min="150" max="2500" step="50" value="500"></label>
        </div>
      </section>

      <details class="advanced-controls">
        <summary><span>高级动效参数</span><small>方向、中心与轨迹</small></summary>
        <div class="advanced-body controls-grid">
          <label>运动方向 <select id="direction"><option value="right" selected>向右滑出</option><option value="left">向左滑出</option></select></label>
          <label>纵向位置 <output id="verticalPositionOut">50%</output><input id="verticalPosition" type="range" min="15" max="85" value="50"></label>
          <label>弯曲弹性 <output id="bendEaseOut">68%</output><input id="bendEase" type="range" min="0" max="100" value="68"></label>
          <label>轨迹透明度 <output id="pathOpacityOut">46%</output><input id="pathOpacity" type="range" min="0" max="100" value="46"></label>
        </div>
      </details>

      <section class="color-row color-trio">
        <label>背景<input id="backgroundColor" type="color" value="#000000"></label>
        <label>文字<input id="textColor" type="color" value="#ffffff"></label>
        <label>笔尖<input id="accentColor" type="color" value="#ffc400"></label>
      </section>

      <section class="transport" aria-label="时间轴控制">
        <button id="restartButton" type="button">重播</button><button id="pauseButton" type="button">暂停</button><button id="backButton" type="button">−1 帧</button><button id="forwardButton" type="button">+1 帧</button>
      </section>

      <section class="export-panel">
        <div class="export-config-grid">
          <label><span class="section-label">导出尺寸</span><select id="exportPreset">
            <option value="current">当前画板</option><option value="1080x1080">1:1 · 1080 × 1080</option><option value="1080x1350">4:5 · 1080 × 1350</option><option value="1080x1440">3:4 · 1080 × 1440</option><option value="1080x1620">2:3 · 1080 × 1620</option><option value="1080x1920">9:16 · 1080 × 1920</option><option value="1920x1080">16:9 · 1920 × 1080</option><option value="1200x628">1.91:1 · 1200 × 628</option><option value="custom">自定义尺寸</option>
          </select></label>
          <label><span class="section-label">GIF / 视频时长</span><select id="exportDuration">
            <option value="full">完整循环</option><option value="1">1 秒</option><option value="2">2 秒</option><option value="3">3 秒</option><option value="5">5 秒</option><option value="10">10 秒</option><option value="custom">自定义秒数</option>
          </select></label>
        </div>
        <div class="custom-size" id="customSize" hidden><label>宽<input id="exportWidth" type="number" min="240" max="3840" value="1080"></label><span>×</span><label>高<input id="exportHeight" type="number" min="240" max="3840" value="1920"></label></div>
        <div class="custom-duration" id="customDuration" hidden><label>自定义时长<input id="exportDurationCustom" type="number" min="0.5" max="15" step="0.1" value="4.2"></label><span>秒</span></div>
        <div class="export-actions"><button id="exportPng" type="button">PNG 图片</button><button id="exportGif" type="button">GIF 动图</button><button id="exportVideo" type="button">视频</button></div>
        <p class="export-status" id="exportStatus" aria-live="polite">画面始终以输出中心重新计算；GIF 与视频按所选秒数导出。</p>
      </section>
      <p class="formula">轨迹 = 正弦波 × 倾斜角<br>字形旋转 = 当前路径切线角度</p>
    </div>
  </details>

  <script src="js/continuation-gif.js"></script>
  <script src="pathwriter.js?v=20260824-fonts1"></script>
  <script src="me-motion-editor.js"></script>
  <script src="stg-cn.js?v=20260824-fonts1"></script>
</body>
</html>
